  linux-riscv64-package:
    name: Linux / riscv64 / Package
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - name: Cache Cargo build inputs
      uses: actions/cache@v5
      with:
        path: |-
          ~/.cargo/registry
          ~/.cargo/git
          target/riscv64gc-unknown-linux-gnu
        key: release-cargo-riscv64-${{ hashFiles('Cargo.lock', 'tools/ci/toolchains.json', 'tools/ci/cross_package.py')
          }}-${{ github.sha }}
        restore-keys: release-cargo-riscv64-${{ hashFiles('Cargo.lock', 'tools/ci/toolchains.json', 'tools/ci/cross_package.py')
          }}-
    - name: Enable RISC-V container execution
      uses: docker/setup-qemu-action@v4
      with:
        platforms: riscv64
    - uses: actions/setup-python@v6
