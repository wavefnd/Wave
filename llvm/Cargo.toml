[package]
name = "llvm"
version = "0.1.0"
edition = "2021"

[dependencies]
parser = { path = "../front/parser" }
hir = { path = "../front/hir" }
lexer = { path = "../front/lexer" }
error = { path = "../front/error" }
utils = { path = "../utils" }
plist = "=1.7.4"
# Wave does not use Inkwell's libffi execution engine. LLVM's own dependencies
# are supplied by llvm-config, including libffi when the selected SDK needs it.
inkwell = { version = "0.8.0", default-features = false, features = ["llvm21-1", "no-libffi-linking"] }
llvm-sys = { version = "211.0.0", features = ["prefer-dynamic"] }

[features]
default = ["llvm-target-core64", "llvm-target-loongarch"]
llvm-target-core64 = ["llvm-target-x86", "llvm-target-aarch64", "llvm-target-riscv"]
llvm-target-all = ["inkwell/target-all"]
llvm-target-aarch64 = ["inkwell/target-aarch64"]
llvm-target-loongarch = ["inkwell/target-loongarch"]
llvm-target-riscv = ["inkwell/target-riscv"]
llvm-target-wasm = ["inkwell/target-webassembly"]
llvm-target-x86 = ["inkwell/target-x86"]
