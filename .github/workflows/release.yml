# SPDX-License-Identifier: MPL-2.0
name: Wave Release
run-name: Wave Release / ${{ inputs.version }}
'on':
  workflow_dispatch:
    inputs:
      version:
        description: Cargo version without the v prefix
        required: true
        type: string
      draft:
        description: Create the GitHub release as a draft
        required: true
        default: true
        type: boolean
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: wave-release-${{ inputs.version }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  NO_COLOR: '1'
  RELEASE_VERSION: ${{ inputs.version }}
jobs:
  release-gate:
    name: Shared / Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Setup pinned native Rust tooling
      uses: dtolnay/rust-toolchain@1.89.0
    - name: Build native Rust maintenance tool
      id: tooling_bootstrap
      shell: bash
      timeout-minutes: 10
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup build-ci -Dcompiler=false
        ./build-ci/wave-tools prepare tooling --github-env "$GITHUB_ENV"
        ./build-ci/wave-tools prepare pins --github-env "$GITHUB_ENV"
    - name: Validate branch, version, and tag
      id: stage-3
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" release --stage gate
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Record native Actions outcomes
      id: ci_report
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" ci report --target-id "$WAVE_CI_TARGET" --output ci-report.json
      env:
        WAVE_STEP_OUTCOMES: ${{ toJSON(steps) }}
      if: |-
        ${{ always() && steps.tooling_bootstrap.outcome == 'success' }}
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-release-shared-gate
        path: 'ci-report.json

          ${{ runner.temp }}/wave-ci-*/*.log

          '
        if-no-files-found: warn
        retention-days: 7
    env:
      WAVE_CI_TARGET: linux-amd64
      WAVE_RELEASE_INPUTS: ${{ toJSON(inputs || fromJSON('{}')) }}
  linux-amd64-validate:
    name: Linux / amd64 / Validate
    needs:
    - release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
      with:
        components: rustfmt, clippy
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build native Rust maintenance tool
      id: tooling_bootstrap
      shell: bash
      timeout-minutes: 10
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup build-ci -Dcompiler=false
        ./build-ci/wave-tools prepare tooling --github-env "$GITHUB_ENV"
        ./build-ci/wave-tools prepare pins --github-env "$GITHUB_ENV"
    - name: Validate branch, version, and tag
      id: stage-3
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" release --stage gate
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Install LLVM 21
      id: stage-4
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare host --target "$WAVE_CI_TARGET" --provision
    - name: Verify LLVM tools
      id: stage-5
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        llvm-config --version
        llvm-config --targets-built
        llvm-mc --version
        llc --version
        ld.lld --version
    - name: Check formatting
      id: stage-6
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" maintain format --check
    - name: Check standard library policy
      id: stage-7
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" check std-policy
    - name: Run Clippy
      id: stage-8
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        cargo clippy --jobs 2 --locked --all-targets -- -D warnings
    - name: Build warning-free Rust documentation
      id: stage-9
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        cargo doc --locked --no-deps --jobs 2
      env:
        RUSTDOCFLAGS: -D warnings
    - name: Run native Rust tooling contracts
      id: stage-10
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain test -C build-ci --suite tooling --print-errorlogs
    - name: Run Rust tests
      id: stage-11
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        cargo test --jobs 2 --locked --all-targets --verbose
    - name: Build release compiler
      id: stage-12
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup --reconfigure .tmp/meson/build_release_compiler-0 . -Dcompiler_target=native -Dbuildtype=release -Dllvm_features=auto
        python -m mesonbuild.mesonmain compile -C .tmp/meson/build_release_compiler-0 --jobs 2 wavec
    - name: Install Wave stdlib
      id: stage-13
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare std
    - name: Print compiler version
      id: stage-14
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        target/release/wavec -V
    - name: Check examples and standard library corpus
      id: stage-15
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" corpus --wavec target/release/wavec --run-std-examples --report-json wave-corpus.json
    - name: Run Wave end-to-end tests
      id: stage-16
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" test --report-json wave-e2e-report.json
    - name: Record native Actions outcomes
      id: ci_report
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" ci report --target-id "$WAVE_CI_TARGET" --output ci-report.json
      env:
        WAVE_STEP_OUTCOMES: ${{ toJSON(steps) }}
      if: |-
        ${{ always() && steps.tooling_bootstrap.outcome == 'success' }}
    - name: Upload Wave end-to-end report
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: evidence-release-linux-amd64-validate-e2e
        path: 'wave-e2e-report.json

          '
        if-no-files-found: warn
        retention-days: 7
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-release-linux-amd64-validate
        path: 'ci-report.json

          ${{ runner.temp }}/wave-ci-*/*.log

          '
        if-no-files-found: warn
        retention-days: 7
    env:
      WAVE_CI_TARGET: linux-amd64
      WAVE_RELEASE_INPUTS: ${{ toJSON(inputs || fromJSON('{}')) }}
  linux-loong64-validate:
    name: Linux / loong64 / Validate
    needs:
    - release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v5
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build native Rust maintenance tool
      id: tooling_bootstrap
      shell: bash
      timeout-minutes: 10
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup build-ci -Dcompiler=false
        ./build-ci/wave-tools prepare tooling --github-env "$GITHUB_ENV"
        ./build-ci/wave-tools prepare pins --github-env "$GITHUB_ENV"
    - name: Install LLVM 21, LLD, and QEMU
      id: stage-2
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare host --target "$WAVE_CI_TARGET" --provision
    - name: Install pinned official LoongArch64 toolchain
      id: stage-3
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare loongarch --provision
    - name: Install Wave stdlib
      id: stage-4
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare std
    - name: Build compiler target sets
      id: stage-5
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup --reconfigure .tmp/meson/build_compiler_target_sets-0 . -Dcompiler_target=native -Dbuildtype=release -Dllvm_features=auto
        python -m mesonbuild.mesonmain compile -C .tmp/meson/build_compiler_target_sets-0 --jobs 2 wavec
        python -m mesonbuild.mesonmain setup --reconfigure .tmp/meson/build_compiler_target_sets-1 . -Dcompiler_target=native -Dbuildtype=debug -Dllvm_features=llvm-target-loongarch
        python -m mesonbuild.mesonmain compile -C .tmp/meson/build_compiler_target_sets-1 --jobs 2 wavec
    - name: Run LoongArch64 contracts
      id: stage-6
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        cargo test --locked --test codegen_regressions loongarch64 --jobs 2 -- --nocapture
      env:
        WAVE_RUN_LOONGARCH64_INTEROP_TESTS: '1'
    - name: Link and run Linux LoongArch64 Hello World
      id: stage-7
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" test --wavec target/release/wavec --target-id "$WAVE_CI_TARGET" --source tests/cases/shared/test2.wave --hosted-abi --stdout-exact 'Hello World'
    - name: Record native Actions outcomes
      id: ci_report
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" ci report --target-id "$WAVE_CI_TARGET" --output ci-report.json
      env:
        WAVE_STEP_OUTCOMES: ${{ toJSON(steps) }}
      if: |-
        ${{ always() && steps.tooling_bootstrap.outcome == 'success' }}
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-release-linux-loong64-validate
        path: 'ci-report.json

          ${{ runner.temp }}/wave-ci-*/*.log

          '
        if-no-files-found: warn
        retention-days: 7
    env:
      WAVE_CI_TARGET: linux-loong64
      WAVE_RELEASE_INPUTS: ${{ toJSON(inputs || fromJSON('{}')) }}
  linux-riscv64-validate:
    name: Linux / riscv64 / Validate
    needs:
    - release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v5
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build native Rust maintenance tool
      id: tooling_bootstrap
      shell: bash
      timeout-minutes: 10
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup build-ci -Dcompiler=false
        ./build-ci/wave-tools prepare tooling --github-env "$GITHUB_ENV"
        ./build-ci/wave-tools prepare pins --github-env "$GITHUB_ENV"
    - name: Install LLVM 21 and RISC-V runtime tools
      id: stage-2
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare host --target "$WAVE_CI_TARGET" --provision
    - name: Verify RISC-V toolchain
      id: stage-3
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        llvm-config --version
        ld.lld --version
        riscv64-linux-gnu-gcc --version
        riscv64-linux-gnu-readelf --version
        qemu-riscv64 --version
    - name: Install Wave stdlib
      id: stage-4
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare std
    - name: Build release compiler
      id: stage-5
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup --reconfigure .tmp/meson/build_release_compiler_2-0 . -Dcompiler_target=native -Dbuildtype=release -Dllvm_features=auto
        python -m mesonbuild.mesonmain compile -C .tmp/meson/build_release_compiler_2-0 --jobs 2 wavec
    - name: Build RISC-V-only LLVM feature set
      id: stage-6
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup --reconfigure .tmp/meson/build_with_the_risc_v_only_llvm_feature-0 . -Dcompiler_target=native -Dbuildtype=debug -Dllvm_features=llvm-target-riscv
        python -m mesonbuild.mesonmain compile -C .tmp/meson/build_with_the_risc_v_only_llvm_feature-0 --jobs 2 wavec
    - name: Build core 64-bit LLVM feature set
      id: stage-7
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup --reconfigure .tmp/meson/build_core_64_bit_llvm_feature_set-0 . -Dcompiler_target=native -Dbuildtype=debug -Dllvm_features=llvm-target-core64
        python -m mesonbuild.mesonmain compile -C .tmp/meson/build_core_64_bit_llvm_feature_set-0 --jobs 2 wavec
    - name: Run RISC-V contract tests
      id: stage-8
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        cargo test --locked --test codegen_regressions riscv64_ --jobs 2 --verbose
      env:
        WAVE_RUN_RISCV64_INTEROP_TESTS: '1'
    - name: Link and run Linux riscv64 Hello World
      id: stage-9
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" test --wavec target/release/wavec --target-id "$WAVE_CI_TARGET" --source tests/cases/shared/test2.wave --hosted-abi --stdout-exact 'Hello World'
    - name: Record native Actions outcomes
      id: ci_report
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" ci report --target-id "$WAVE_CI_TARGET" --output ci-report.json
      env:
        WAVE_STEP_OUTCOMES: ${{ toJSON(steps) }}
      if: |-
        ${{ always() && steps.tooling_bootstrap.outcome == 'success' }}
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-release-linux-riscv64-validate
        path: 'ci-report.json

          ${{ runner.temp }}/wave-ci-*/*.log

          '
        if-no-files-found: warn
        retention-days: 7
    env:
      WAVE_CI_TARGET: linux-riscv64
      WAVE_RELEASE_INPUTS: ${{ toJSON(inputs || fromJSON('{}')) }}
  linux-native-package:
    name: Linux / ${{ matrix.display_arch }} / Package
    needs:
    - release-gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          display_arch: amd64
          runner: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
          archive_target: x86_64-linux-gnu
        - arch: arm64
          display_arch: arm64
          runner: ubuntu-24.04-arm
          target: aarch64-unknown-linux-gnu
          archive_target: aarch64-linux-gnu
    steps:
    - uses: actions/checkout@v5
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build native Rust maintenance tool
      id: tooling_bootstrap
      shell: bash
      timeout-minutes: 10
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup build-ci -Dcompiler=false
        ./build-ci/wave-tools prepare tooling --github-env "$GITHUB_ENV"
        ./build-ci/wave-tools prepare pins --github-env "$GITHUB_ENV"
    - name: Resolve canonical distribution identity
      id: package_paths
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" ci artifact --target "$WAVE_CI_TARGET" --github-output "$GITHUB_OUTPUT"
    - name: Install packaging dependencies
      id: stage-3
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare host --target "$WAVE_CI_TARGET" --provision
    - name: Verify release tools
      id: stage-4
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        llvm-config --version
        llvm-config --targets-built
        llvm-mc --version
        llc --version
        ld.lld --version
    - name: Build and package
      id: stage-5
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup --reconfigure .tmp/meson/build_and_package-0 . "-Dcompiler_target=$WAVE_MATRIX_TARGET" -Dbuildtype=release -Dllvm_features=auto
        python -m mesonbuild.mesonmain compile -C .tmp/meson/build_and_package-0 --jobs 2 release
      env:
        WAVE_MATRIX_TARGET: ${{ matrix.target }}
    - name: Smoke test packaged compiler
      id: stage-6
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" check extracted-package --archive "$WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_ARCHIVE" --target "$WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_TARGET" --output "$RUNNER_TEMP/extracted-package"
      env:
        WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_ARCHIVE: ${{ steps.package_paths.outputs.archive }}
        WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_TARGET: ${{ steps.package_paths.outputs.target }}
    - name: Record native Actions outcomes
      id: ci_report
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" ci report --target-id "$WAVE_CI_TARGET" --output ci-report.json
      env:
        WAVE_STEP_OUTCOMES: ${{ toJSON(steps) }}
      if: |-
        ${{ always() && steps.tooling_bootstrap.outcome == 'success' }}
    - uses: actions/upload-artifact@v6
      with:
        name: release-package-linux-${{ matrix.display_arch }}
        path: 'wave-v${{ inputs.version }}-${{ matrix.archive_target }}.tar.gz

          wave-v${{ inputs.version }}-${{ matrix.archive_target }}.tar.gz.sha256

          wave-v${{ inputs.version }}-${{ matrix.archive_target }}.tar.gz.metadata.json

          '
        if-no-files-found: error
        retention-days: 7
      name: Upload package
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-release-linux-${{ matrix.display_arch }}-package
        path: 'ci-report.json

          ${{ runner.temp }}/wave-ci-*/*.log

          '
        if-no-files-found: warn
        retention-days: 7
    env:
      WAVE_CI_TARGET: ${{ matrix.target }}
      WAVE_RELEASE_INPUTS: ${{ toJSON(inputs || fromJSON('{}')) }}
  linux-loong64-package:
    name: Linux / loong64 / Package
    needs:
    - release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@v5
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - name: Enable LoongArch64 compiler execution
      uses: docker/setup-qemu-action@v4
      with:
        platforms: loong64
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build native Rust maintenance tool
      id: tooling_bootstrap
      shell: bash
      timeout-minutes: 10
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup build-ci -Dcompiler=false
        ./build-ci/wave-tools prepare tooling --github-env "$GITHUB_ENV"
        ./build-ci/wave-tools prepare pins --github-env "$GITHUB_ENV"
    - name: Resolve canonical distribution identity
      id: package_paths
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" ci artifact --target "$WAVE_CI_TARGET" --github-output "$GITHUB_OUTPUT"
    - name: Install host build and emulation tools
      id: stage-3
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare host --target "$WAVE_CI_TARGET" --provision
    - name: Install pinned LoongArch toolchain
      id: stage-5-prerequisites-loongarch
      shell: bash
      timeout-minutes: 240
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare loongarch --provision
    - name: Validate pinned target SDK and configure Cargo
      id: stage-5-sdk
      shell: bash
      timeout-minutes: 240
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare cross --target "$WAVE_CI_TARGET" --work-dir "$RUNNER_TEMP/wave-cross-package" --sysroot "$WAVE_LOONGARCH64_SYSROOT" --cross-prefix "$WAVE_LOONGARCH64_SYSROOT/../bin/loongarch64-unknown-linux-gnu-" --host-llvm-bin "$LLVM_SYS_211_PREFIX/bin"
    - name: Build and smoke-test native LoongArch64 release
      id: stage-5
      shell: bash
      timeout-minutes: 240
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup --reconfigure .tmp/meson/cross-package . "-Dcompiler_target=$WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_TARGET" -Dbuildtype=release
        python -m mesonbuild.mesonmain compile -C .tmp/meson/cross-package --jobs 2 release
        "$WAVE_TOOLS" check extracted-package --archive "$WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_ARCHIVE" --target "$WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_TARGET" --output "$RUNNER_TEMP/extracted-package"
      env:
        WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_TARGET: ${{ steps.package_paths.outputs.target }}
        WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_ARCHIVE: ${{ steps.package_paths.outputs.archive }}
    - name: Record native Actions outcomes
      id: ci_report
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" ci report --target-id "$WAVE_CI_TARGET" --output ci-report.json
      env:
        WAVE_STEP_OUTCOMES: ${{ toJSON(steps) }}
      if: |-
        ${{ always() && steps.tooling_bootstrap.outcome == 'success' }}
    - uses: actions/upload-artifact@v6
      with:
        name: release-package-linux-loong64
        path: 'wave-v${{ inputs.version }}-loongarch64-linux-gnu.tar.gz

          wave-v${{ inputs.version }}-loongarch64-linux-gnu.tar.gz.sha256

          wave-v${{ inputs.version }}-loongarch64-linux-gnu.tar.gz.metadata.json

          '
        if-no-files-found: error
        retention-days: 7
      name: Upload package
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
