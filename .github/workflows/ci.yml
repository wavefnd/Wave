  windows-amd64-build:
    name: Windows / amd64 / Build & test
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@1.89.0
      with:
        toolchain: 1.89.0-x86_64-pc-windows-msvc
        components: rustfmt, clippy
    - uses: actions/setup-python@v6
      id: python_setup
      with:
        python-version: '3.11'
        architecture: x64
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build native Rust maintenance tool
      id: tooling_bootstrap
      shell: pwsh
      timeout-minutes: 10
      run: |
        $ErrorActionPreference = "Stop"
        & 'python' '-m' 'mesonbuild.mesonmain' 'setup' 'build-ci' '-Dcompiler=false'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & './build-ci/wave-tools.exe' 'prepare' 'tooling' '--github-env' "$env:GITHUB_ENV"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & './build-ci/wave-tools.exe' 'prepare' 'pins' '--github-env' "$env:GITHUB_ENV"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Resolve canonical distribution identity
      id: package_paths
      shell: pwsh
      timeout-minutes: 30
      run: |
        $ErrorActionPreference = "Stop"
        & $env:WAVE_TOOLS 'ci' 'artifact' '--target' "$env:WAVE_CI_TARGET" '--github-output' "$env:GITHUB_OUTPUT"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Install pinned native LLVM SDK
      id: stage-3
      shell: pwsh
      timeout-minutes: 30
      run: |
        $ErrorActionPreference = "Stop"
        & 'pwsh' '-NoProfile' '-File' './tools/provision_windows_msvc_llvm.ps1' '-Architecture' 'x64'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Provision matching LLVM dependencies and audit CRT
      id: stage-4
      shell: pwsh
      timeout-minutes: 30
      run: |
        $ErrorActionPreference = "Stop"
        & 'pwsh' '-NoProfile' '-File' './tools/provision_windows_msvc_libxml2.ps1' '-Architecture' 'x64'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Verify native host and enabled LLVM backends
      id: stage-5
      shell: pwsh
      timeout-minutes: 30
      run: |
        $ErrorActionPreference = "Stop"
        & $env:WAVE_TOOLS 'check' 'windows-host' '--target' 'x86_64-pc-windows-msvc'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Check formatting
      id: stage-6
      shell: pwsh
      timeout-minutes: 30
      run: |
        $ErrorActionPreference = "Stop"
        & $env:WAVE_TOOLS 'maintain' 'format' '--check'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Check all native targets
      id: stage-7
      shell: pwsh
      timeout-minutes: 30
      run: |
        $ErrorActionPreference = "Stop"
        & 'cargo' 'check' '--locked' '--workspace' '--all-targets' '--target' 'x86_64-pc-windows-msvc' '--no-default-features' '--features' 'llvm-target-core64' '--jobs' '2'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Run Clippy
      id: stage-8
      shell: pwsh
      timeout-minutes: 30
      run: |
        $ErrorActionPreference = "Stop"
        & 'cargo' 'clippy' '--locked' '--workspace' '--all-targets' '--target' 'x86_64-pc-windows-msvc' '--no-default-features' '--features' 'llvm-target-core64' '--jobs' '2' '--' '-D' 'warnings'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Build release compiler
      id: native_build
      shell: pwsh
      timeout-minutes: 30
      run: |
        $ErrorActionPreference = "Stop"
        & 'python' '-m' 'mesonbuild.mesonmain' 'setup' '--reconfigure' '.tmp/meson/build_release_compiler_3-0' '.' '-Dcompiler_target=x86_64-pc-windows-msvc' '-Dbuildtype=release' '-Dllvm_features=llvm-target-core64'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & 'python' '-m' 'mesonbuild.mesonmain' 'compile' '-C' '.tmp/meson/build_release_compiler_3-0' '--jobs' '2' 'wavec'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Run native hosted MSVC and bidirectional C ABI fixtures
      id: msvc_native
      shell: pwsh
      timeout-minutes: 20
      run: |
        $ErrorActionPreference = "Stop"
