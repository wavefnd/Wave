  linux-riscv64-build:
    name: Linux / riscv64 / Build & test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v5
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
      with:
        components: rustfmt, clippy
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build and test
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix || fromJSON('{}')) }}
      run: >-
