# SPDX-License-Identifier: MPL-2.0
name: Wave Release
run-name: Wave Release / ${{ inputs.version }}
'on':
  workflow_dispatch:
    inputs:
      version:
        description: Cargo version without the v prefix
        required: true
        type: string
      draft:
        description: Create the GitHub release as a draft
        required: true
        default: true
        type: boolean
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: wave-release-${{ inputs.version }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  NO_COLOR: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  RELEASE_VERSION: ${{ inputs.version }}
jobs:

  # Shared
  release-gate:
    name: Shared / Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Validate release identity
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix || fromJSON('{}')) }}
        WAVE_RELEASE_INPUTS: ${{ toJSON(inputs || fromJSON('{}')) }}
      run: python3 -m tools.ci.release --target "linux-amd64" --lane release/gate --report-json ci-report.json
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-release-shared-gate
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7

  # Linux
  linux-amd64-validate:
    name: Linux / amd64 / Validate
    needs:
    - release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
      with:
        components: rustfmt, clippy
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Validate release
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix || fromJSON('{}')) }}
        WAVE_RELEASE_INPUTS: ${{ toJSON(inputs || fromJSON('{}')) }}
      run: python3 -m tools.ci.release --target "linux-amd64" --lane release/validate --provision --report-json
        ci-report.json
    - name: Upload Wave end-to-end report
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: evidence-release-linux-amd64-validate-e2e
        path: |
          wave-e2e-report.json
        if-no-files-found: warn
        retention-days: 7
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-release-linux-amd64-validate
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
  linux-loong64-validate:
    name: Linux / loong64 / Validate
    needs:
    - release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v5
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Validate release
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix || fromJSON('{}')) }}
        WAVE_RELEASE_INPUTS: ${{ toJSON(inputs || fromJSON('{}')) }}
      run: python3 -m tools.ci.release --target "linux-loong64" --lane release/validate-loongarch64 --provision
        --report-json ci-report.json
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-release-linux-loong64-validate
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
  linux-riscv64-validate:
    name: Linux / riscv64 / Validate
    needs:
    - release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v5
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Validate release
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix || fromJSON('{}')) }}
        WAVE_RELEASE_INPUTS: ${{ toJSON(inputs || fromJSON('{}')) }}
      run: python3 -m tools.ci.release --target "linux-riscv64" --lane release/validate-riscv64 --provision --report-json
        ci-report.json
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-release-linux-riscv64-validate
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
  linux-native-package:
    name: Linux / ${{ matrix.display_arch }} / Package
    needs:
    - release-gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          display_arch: amd64
          runner: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
          archive_target: x86_64-linux-gnu
        - arch: arm64
          display_arch: arm64
          runner: ubuntu-24.04-arm
          target: aarch64-unknown-linux-gnu
          archive_target: aarch64-linux-gnu
    steps:
    - uses: actions/checkout@v5
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build and verify package
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix || fromJSON('{}')) }}
        WAVE_RELEASE_INPUTS: ${{ toJSON(inputs || fromJSON('{}')) }}
      run: python3 -m tools.ci.release --target "${{ matrix.target }}" --lane release/package-linux --provision
        --report-json ci-report.json
    - uses: actions/upload-artifact@v6
      with:
        name: release-package-linux-${{ matrix.display_arch }}
        path: |
          wave-v${{ inputs.version }}-${{ matrix.archive_target }}.tar.gz
          wave-v${{ inputs.version }}-${{ matrix.archive_target }}.tar.gz.sha256
          wave-v${{ inputs.version }}-${{ matrix.archive_target }}.tar.gz.metadata.json
        if-no-files-found: error
        retention-days: 7
      name: Upload package
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-release-linux-${{ matrix.display_arch }}-package
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
  linux-loong64-package:
    name: Linux / loong64 / Package
    needs:
    - release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@v5
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - name: Enable LoongArch64 compiler execution
      uses: docker/setup-qemu-action@v4
      with:
        platforms: loong64
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build and verify package
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix || fromJSON('{}')) }}
        WAVE_RELEASE_INPUTS: ${{ toJSON(inputs || fromJSON('{}')) }}
      run: python3 -m tools.ci.release --target "linux-loong64" --lane release/package-linux-loongarch64 --provision
        --report-json ci-report.json
    - uses: actions/upload-artifact@v6
      with:
        name: release-package-linux-loong64
        path: |
          wave-v${{ inputs.version }}-loongarch64-linux-gnu.tar.gz
          wave-v${{ inputs.version }}-loongarch64-linux-gnu.tar.gz.sha256
          wave-v${{ inputs.version }}-loongarch64-linux-gnu.tar.gz.metadata.json
        if-no-files-found: error
        retention-days: 7
      name: Upload package
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-release-linux-loong64-package
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
  linux-riscv64-package:
    name: Linux / riscv64 / Package
    needs:
    - release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v5
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - name: Cache Cargo build inputs
      uses: actions/cache@v5
      with:
        path: |-
          ~/.cargo/registry
          ~/.cargo/git
          target/riscv64gc-unknown-linux-gnu
        key: release-cargo-riscv64-${{ hashFiles('Cargo.lock', 'tools/ci/toolchains.json', 'tools/ci/cross_package.py')
          }}-${{ github.sha }}
        restore-keys: release-cargo-riscv64-${{ hashFiles('Cargo.lock', 'tools/ci/toolchains.json', 'tools/ci/cross_package.py')
          }}-
    - name: Enable RISC-V container execution
      uses: docker/setup-qemu-action@v4
      with:
        platforms: riscv64
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build and verify package
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix || fromJSON('{}')) }}
        WAVE_RELEASE_INPUTS: ${{ toJSON(inputs || fromJSON('{}')) }}
      run: python3 -m tools.ci.release --target "linux-riscv64" --lane release/package-linux-riscv64 --provision
        --report-json ci-report.json
    - uses: actions/upload-artifact@v6
      with:
        name: release-package-linux-riscv64
        path: |
          wave-v${{ inputs.version }}-riscv64-linux-gnu.tar.gz
          wave-v${{ inputs.version }}-riscv64-linux-gnu.tar.gz.sha256
          wave-v${{ inputs.version }}-riscv64-linux-gnu.tar.gz.metadata.json
        if-no-files-found: error
        retention-days: 7
      name: Upload package
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-release-linux-riscv64-package
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7

  # macOS
  macos-native-package:
    name: macOS / ${{ matrix.display_arch }} / Package
    needs:
    - release-gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          display_arch: amd64
          runner: macos-15-intel
          target: x86_64-apple-darwin
        - arch: arm64
          display_arch: arm64
          runner: macos-15
          target: aarch64-apple-darwin
    steps:
    - uses: actions/checkout@v5
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build and verify package
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix || fromJSON('{}')) }}
        WAVE_RELEASE_INPUTS: ${{ toJSON(inputs || fromJSON('{}')) }}
      run: python3 -m tools.ci.release --target "${{ matrix.target }}" --lane release/package-macos --provision
        --report-json ci-report.json
    - uses: actions/upload-artifact@v6
      with:
        name: release-package-macos-${{ matrix.display_arch }}
        path: |
          wave-v${{ inputs.version }}-${{ matrix.target }}.tar.gz
          wave-v${{ inputs.version }}-${{ matrix.target }}.tar.gz.sha256
          wave-v${{ inputs.version }}-${{ matrix.target }}.tar.gz.metadata.json
        if-no-files-found: error
        retention-days: 7
      name: Upload package
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-release-macos-${{ matrix.display_arch }}-package
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7

  # Windows
  windows-amd64-package:
    name: Windows / amd64 / Package
    needs:
    - release-gate
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@1.89.0
      with:
        toolchain: 1.89.0-x86_64-pc-windows-msvc
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        architecture: x64
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build and verify package
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix || fromJSON('{}')) }}
        WAVE_RELEASE_INPUTS: ${{ toJSON(inputs || fromJSON('{}')) }}
      run: python -m tools.ci.release --target "windows-amd64" --lane release/package-windows --provision --report-json
        ci-report.json
    - name: Preserve native execution evidence
      if: ${{ always() && steps.procedure.outputs.native_acceptance != 'skipped' }}
      uses: actions/upload-artifact@v6
      with:
        name: evidence-release-windows-amd64-package-native-tests
        path: ${{ runner.temp }}/wave-msvc-native-x64/
        retention-days: 7
    - name: Preserve case evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: evidence-release-windows-amd64-package-cases
        path: wave-cases-windows-amd64.json
    - name: Preserve package acceptance evidence
      if: ${{ always() && steps.procedure.outputs.package_smoke != 'skipped' }}
      uses: actions/upload-artifact@v6
      with:
        name: evidence-release-windows-amd64-package-package-tests
        path: ${{ runner.temp }}/wave-package-x64/
        retention-days: 7
    - uses: actions/upload-artifact@v6
      with:
        name: release-package-windows-amd64
        path: |
          wave-v${{ inputs.version }}-x86_64-pc-windows-msvc.zip
          wave-v${{ inputs.version }}-x86_64-pc-windows-msvc.zip.sha256
          wave-v${{ inputs.version }}-x86_64-pc-windows-msvc.zip.metadata.json
        if-no-files-found: error
      name: Upload package
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-release-windows-amd64-package
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
  windows-arm64-package:
    name: Windows / arm64 / Package
    needs:
    - release-gate
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@1.89.0
      with:
        toolchain: 1.89.0-aarch64-pc-windows-msvc
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        architecture: arm64
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build and verify package
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix || fromJSON('{}')) }}
        WAVE_RELEASE_INPUTS: ${{ toJSON(inputs || fromJSON('{}')) }}
      run: python -m tools.ci.release --target "windows-arm64" --lane release/package-windows-arm64 --provision
        --report-json ci-report.json
    - name: Preserve native execution evidence
      if: ${{ always() && steps.procedure.outputs.native_acceptance != 'skipped' }}
      uses: actions/upload-artifact@v6
      with:
        name: evidence-release-windows-arm64-package-native-tests
        path: ${{ runner.temp }}/wave-msvc-native-arm64/
        retention-days: 7
    - name: Preserve case evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: evidence-release-windows-arm64-package-cases
        path: wave-cases-windows-arm64.json
    - name: Preserve package acceptance evidence
      if: ${{ always() && steps.procedure.outputs.package_smoke != 'skipped' }}
      uses: actions/upload-artifact@v6
      with:
        name: evidence-release-windows-arm64-package-package-tests
        path: ${{ runner.temp }}/wave-package-arm64/
        retention-days: 7
    - uses: actions/upload-artifact@v6
      with:
        name: release-package-windows-arm64
        path: |
          wave-v${{ inputs.version }}-aarch64-pc-windows-msvc.zip
          wave-v${{ inputs.version }}-aarch64-pc-windows-msvc.zip.sha256
          wave-v${{ inputs.version }}-aarch64-pc-windows-msvc.zip.metadata.json
        if-no-files-found: error
      name: Upload package
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-release-windows-arm64-package
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7

  # FreeBSD
  freebsd-amd64-package:
    name: FreeBSD / amd64 / Package
    needs:
    - release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Select FreeBSD VM cache
      id: freebsd-cache
      run: python3 -m tools.ci.freebsd_cache --github-output "$GITHUB_OUTPUT"
    - name: Restore FreeBSD tools and Cargo cache
      uses: actions/cache@v5
      with:
        path: ${{ steps.freebsd-cache.outputs.path }}
        key: ${{ steps.freebsd-cache.outputs.key }}
        restore-keys: ${{ steps.freebsd-cache.outputs.restore-prefix }}
    - name: Build and validate FreeBSD package
      env:
        GH_TOKEN: ${{ github.token }}
      run: >-
        python3 -m mesonbuild.mesonmain setup build-ci "-Dcompiler=false" "-Dci_family=package"
        "-Dci_target=freebsd-amd64" "-Dci_provision=true" "-Dci_report=ci-report.json" && python3 -m
        mesonbuild.mesonmain compile -C build-ci ci
    - uses: actions/upload-artifact@v6
      with:
        name: release-package-freebsd-amd64
        path: wave-v${{ inputs.version }}-x86_64-unknown-freebsd.tar.gz*
        if-no-files-found: error
        retention-days: 7
      name: Upload package
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-release-freebsd-amd64-package
        path: |-
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
    env:
      RELEASE_VERSION: ${{ inputs.version }}

  # Publication
  publish:
    name: Shared / Publish
    needs:
    - release-gate
    - linux-amd64-validate
    - linux-riscv64-validate
    - linux-loong64-validate
    - linux-native-package
    - linux-riscv64-package
    - linux-loong64-package
    - macos-native-package
    - windows-amd64-package
    - windows-arm64-package
    - freebsd-amd64-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - uses: actions/download-artifact@v7
      with:
        pattern: release-package-*
        path: release-assets
        merge-multiple: true
    - name: Publish release
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix || fromJSON('{}')) }}
        WAVE_RELEASE_INPUTS: ${{ toJSON(inputs || fromJSON('{}')) }}
        GH_TOKEN: ${{ github.token }}
      run: python3 -m tools.ci.release --target "linux-amd64" --lane release/publish --provision --report-json ci-report.json
        --publish
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-release-shared-publish
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
