  build-linux-riscv64:
    name: Build Linux riscv64
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LLVM 21 and RISC-V runtime tools
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y wget software-properties-common
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y \
            binutils-riscv64-linux-gnu \
            gcc-riscv64-linux-gnu \
            libc6-dev-riscv64-cross \
            lld-21 \
            qemu-user

          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG_PATH=/usr/lib/llvm-21/bin/llvm-config" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"

      - name: Verify RISC-V toolchain
        run: |
          set -euo pipefail

          llvm-config --version
          ld.lld --version
          riscv64-linux-gnu-gcc --version
          riscv64-linux-gnu-readelf --version
          qemu-riscv64 --version

      - name: Install Wave stdlib
        run: |
          mkdir -p "$HOME/.wave/lib/wave"
          rm -rf "$HOME/.wave/lib/wave/std"
          cp -R std "$HOME/.wave/lib/wave/std"

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Validate Python tooling
        run: |
          python3 -m py_compile x.py tools/check_wave_corpus.py tools/run_tests.py tools/test_contracts.py tools/test_test_contracts.py
          python3 -m unittest tools.test_test_contracts

      - name: Build release compiler
        run: cargo build --locked --release --verbose

      - name: Run Rust tests
        run: cargo test --locked --all-targets --verbose

      - name: Build with the RISC-V-only LLVM feature
        run: >-
          cargo build --locked --no-default-features
          --features llvm-target-riscv --jobs 2

      - name: Build with the x86-only LLVM feature
        run: >-
          cargo build --locked --no-default-features
          --features llvm-target-x86 --jobs 2

      - name: Build with the AArch64-only LLVM feature
        run: >-
          cargo build --locked --no-default-features
          --features llvm-target-aarch64 --jobs 2

      - name: Build with the core 64-bit LLVM feature set
        run: >-
          cargo build --locked --no-default-features
          --features llvm-target-core64 --jobs 2

      - name: Verify bundled Linux CRT matrix
        if: ${{ always() }}
        run: |
          set -euo pipefail

          crt_root="$(find target/release/build -type d -path '*/out/crt' -print -quit)"
          test -n "$crt_root"

          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            for crt_name in crt1.o Scrt1.o rcrt1.o crti.o crtn.o; do
              test -f "$crt_root/$target/$crt_name"
            done
          done

          for abi in lp64 lp64f lp64d; do
            for crt_name in crt1.o Scrt1.o rcrt1.o crti.o crtn.o; do
              crt_path="$crt_root/riscv64-unknown-linux-gnu/$abi/$crt_name"
              test -f "$crt_path"
              llvm-readelf -h "$crt_path" | grep -Eq 'Machine:[[:space:]]+RISC-V'
            done
          done

          llvm-readelf -h "$crt_root/riscv64-unknown-linux-gnu/lp64/crt1.o" \
            | grep -Eq 'Flags:[[:space:]]+0x1.*RVC'
          llvm-readelf -h "$crt_root/riscv64-unknown-linux-gnu/lp64f/crt1.o" \
            | grep -Eq 'Flags:[[:space:]]+0x3.*single-float ABI'
          llvm-readelf -h "$crt_root/riscv64-unknown-linux-gnu/lp64d/crt1.o" \
            | grep -Eq 'Flags:[[:space:]]+0x5.*double-float ABI'

      - name: Run Wave end-to-end tests
        if: ${{ always() }}
        run: python3 tools/run_tests.py --report-json wave-e2e-report.json

      - name: Upload Wave end-to-end report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: wave-e2e-${{ github.job }}
          path: wave-e2e-report.json
          if-no-files-found: warn

      - name: Run RISC-V contract tests
        if: ${{ always() }}
        env:
          WAVE_RUN_RISCV64_INTEROP_TESTS: "1"
        run: >-
          cargo test --locked --test codegen_regressions riscv64_ --verbose

      - name: Link and run Linux riscv64 binary
        if: ${{ always() }}
        run: |
          set -euo pipefail

          riscv_sysroot="$(target/release/wavec print sysroot \
            --target riscv64-unknown-linux-gnu)"
          test "$riscv_sysroot" = /usr/riscv64-linux-gnu
          output_dir="$RUNNER_TEMP/wave-linux-riscv64"
          binary="$output_dir/test2"
          mkdir -p "$output_dir"

          target/release/wavec build tests/cases/test2.wave \
            --target riscv64-unknown-linux-gnu \
            --out-dir "$output_dir"

          test -x "$binary"
          riscv64-linux-gnu-readelf -h "$binary" | tee "$RUNNER_TEMP/riscv64-elf-header.txt"
          riscv64-linux-gnu-readelf -l "$binary" | tee "$RUNNER_TEMP/riscv64-program-headers.txt"

          grep -Eq 'Machine:[[:space:]]+RISC-V' "$RUNNER_TEMP/riscv64-elf-header.txt"
          grep -Eq 'Flags:[[:space:]]+0x5.*double-float ABI' "$RUNNER_TEMP/riscv64-elf-header.txt"
          grep -Fq '/lib/ld-linux-riscv64-lp64d.so.1' "$RUNNER_TEMP/riscv64-program-headers.txt"

          runtime_output="$(timeout --signal=TERM --kill-after=5s 30s \
            qemu-riscv64 -L "$riscv_sysroot" "$binary")"
          printf '%s\n' "$runtime_output"
          test "$runtime_output" = 'Hello World'

  build-macos-arm64:
    name: Build macOS arm64
