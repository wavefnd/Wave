      with:
        name: evidence-ci-${{ matrix.id }}-cases-shard-${{ matrix.shard_index }}
        path: |
          wave-cases-${{ matrix.id }}-shard-${{ matrix.shard_index }}.json
          wave-cases-${{ matrix.id }}-shard-${{ matrix.shard_index }}-runtime.json
        if-no-files-found: warn
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-ci-${{ matrix.id }}-cases-shard-${{ matrix.shard_index }}
        path: |
          ci-report.json
          wave-corpus.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
  linux-native-package:
    name: Linux / ${{ matrix.display_arch }} / Package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          display_arch: amd64
          runner: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
          archive_target: x86_64-linux-gnu
        - arch: arm64
          display_arch: arm64
          runner: ubuntu-24.04-arm
          target: aarch64-unknown-linux-gnu
          archive_target: aarch64-linux-gnu
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build and verify package
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix || fromJSON('{}')) }}
      run: >-
        python3 -m mesonbuild.mesonmain setup build-ci "-Dcompiler=false" "-Dci_family=package"
        "-Dci_target=${{ matrix.target }}" "-Dci_lanes=release/package-linux" "-Dci_provision=true"
        "-Dci_report=ci-report.json" && python3 -m mesonbuild.mesonmain compile -C build-ci ci
    - uses: actions/upload-artifact@v6
      with:
        name: ci-package-linux-${{ matrix.display_arch }}
        path: |
          wave-v*-${{ matrix.archive_target }}.tar.gz
          wave-v*-${{ matrix.archive_target }}.tar.gz.sha256
          wave-v*-${{ matrix.archive_target }}.tar.gz.metadata.json
        if-no-files-found: error
        retention-days: 7
      name: Upload package
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-ci-linux-${{ matrix.display_arch }}-package
        path: |
          ci-report.json
          wave-corpus.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
  linux-loong64-package:
    name: Linux / loong64 / Package
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - name: Enable LoongArch64 compiler execution
      uses: docker/setup-qemu-action@v4
      with:
        platforms: loong64
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build and verify package
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix || fromJSON('{}')) }}
