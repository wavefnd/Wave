        ./build-ci/wave-tools prepare tooling --github-env "$GITHUB_ENV"
        ./build-ci/wave-tools prepare pins --github-env "$GITHUB_ENV"
    - name: Install LLVM 21
      id: llvm_setup
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare host --target "$WAVE_CI_TARGET" --provision
    - name: Install Wave stdlib
      id: stage-4
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare std
    - name: Check Rust formatting
      id: stage-5
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" maintain format --check
    - name: Run Clippy
      id: stage-6
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        cargo clippy --jobs 2 --locked --all-targets -- -D warnings
    - name: Run native Rust tooling contracts
      id: stage-7
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain test -C build-ci --suite tooling --print-errorlogs
    - name: Build release compiler
      id: stage-8
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup --reconfigure .tmp/meson/build_release_compiler-0 . -Dcompiler_target=native -Dbuildtype=release -Dllvm_features=auto
        python -m mesonbuild.mesonmain compile -C .tmp/meson/build_release_compiler-0 --jobs 2 wavec
    - name: Check and run standard library examples
      id: stage-9
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" corpus --wavec target/release/wavec --run-std-examples --report-json wave-corpus.json
    - name: Run Rust tests
      id: stage-10
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        cargo test --jobs 2 --locked --all-targets --verbose
    - name: Run AArch64 AAPCS64 contract tests
      id: stage-11
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        cargo test --jobs 2 --locked --test codegen_regressions aarch64_c_abi_interoperates_with_c --verbose
      env:
        WAVE_RUN_AARCH64_INTEROP_TESTS: '1'
      if: |-
        ${{ !cancelled() && steps.llvm_setup.outcome == 'success' }}
    - name: Check AArch64 aligned aggregates against Clang
      id: stage-12
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        cargo test --locked --test release_stabilization aarch64_ --jobs 2
      env:
        WAVE_RUN_AARCH64_INTEROP_TESTS: '1'
    - name: Record native Actions outcomes
      id: ci_report
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" ci report --target-id "$WAVE_CI_TARGET" --output ci-report.json
      env:
        WAVE_STEP_OUTCOMES: ${{ toJSON(steps) }}
      if: |-
        ${{ always() && steps.tooling_bootstrap.outcome == 'success' }}
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-ci-linux-arm64-build
        path: 'ci-report.json

          wave-corpus.json

          ${{ runner.temp }}/wave-ci-*/*.log

          '
        if-no-files-found: warn
        retention-days: 7
    env:
      WAVE_CI_TARGET: linux-arm64
  linux-loong64-build:
    name: Linux / loong64 / Build & test
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@v5
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
      with:
        components: rustfmt, clippy
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build native Rust maintenance tool
      id: tooling_bootstrap
      shell: bash
      timeout-minutes: 10
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup build-ci -Dcompiler=false
        ./build-ci/wave-tools prepare tooling --github-env "$GITHUB_ENV"
        ./build-ci/wave-tools prepare pins --github-env "$GITHUB_ENV"
    - name: Install LLVM 21, LLD, and QEMU
      id: stage-3
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare host --target "$WAVE_CI_TARGET" --provision
    - name: Install pinned official LoongArch64 toolchain
      id: stage-4
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare loongarch --provision
    - name: Install Wave stdlib
      id: stage-5
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare std
    - name: Build release compiler
      id: stage-6
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup --reconfigure .tmp/meson/build_release_compiler_2-0 . -Dcompiler_target=native -Dbuildtype=release -Dllvm_features=auto
        python -m mesonbuild.mesonmain compile -C .tmp/meson/build_release_compiler_2-0 --jobs 2 wavec
    - name: Run LoongArch-only LLVM regression tests
      id: stage-7
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        cargo test --locked --no-default-features --features llvm-target-loongarch --test codegen_regressions loongarch64_ --jobs 2
      env:
        WAVE_RUN_LOONGARCH64_INTEROP_TESTS: '1'
    - name: Run frontend regressions with the LoongArch backend only
      id: stage-8
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        cargo test --locked --no-default-features --features llvm-target-loongarch --test frontend_regressions --jobs 2
    - name: Verify LoongArch64 CRT and target contracts
      id: stage-9
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" check crt --receipt .tmp/meson/build_release_compiler_2-0/wavec.build.json --arch loongarch64
        cargo test --locked --jobs 2 --test codegen_regressions loongarch64 -- --nocapture
      env:
        WAVE_RUN_LOONGARCH64_INTEROP_TESTS: '1'
    - name: Link and run Linux LoongArch64 smoke case
      id: stage-10
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" test --wavec target/release/wavec --target-id "$WAVE_CI_TARGET" --source tests/cases/linux/loong64/test2.wave --hosted-abi --stdout-exact 'loongarch workload=pass'
    - name: Run LoongArch64 standard-library smoke set
      id: stage-11
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" test --wavec target/release/wavec --target-id "$WAVE_CI_TARGET" --source examples/std/memory.wave --source examples/std/time.wave --source examples/std/environment.wave --source examples/std/filesystem.wave --source examples/std/io.wave --source examples/std/buffers.wave --source examples/std/datetime_roundtrip.wave --source examples/std/process.wave --report-json loongarch_std.json
    - name: Record native Actions outcomes
      id: ci_report
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" ci report --target-id "$WAVE_CI_TARGET" --output ci-report.json
      env:
        WAVE_STEP_OUTCOMES: ${{ toJSON(steps) }}
      if: |-
        ${{ always() && steps.tooling_bootstrap.outcome == 'success' }}
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-ci-linux-loong64-build
        path: 'ci-report.json

          wave-corpus.json

          ${{ runner.temp }}/wave-ci-*/*.log

          '
        if-no-files-found: warn
        retention-days: 7
    env:
      WAVE_CI_TARGET: linux-loong64
  linux-riscv64-build:
    name: Linux / riscv64 / Build & test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v5
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
      with:
        components: rustfmt, clippy
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build native Rust maintenance tool
      id: tooling_bootstrap
      shell: bash
      timeout-minutes: 10
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup build-ci -Dcompiler=false
        ./build-ci/wave-tools prepare tooling --github-env "$GITHUB_ENV"
