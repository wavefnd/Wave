    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-ci-linux-riscv64-build
        path: |
          ci-report.json
          wave-corpus.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
  linux-targets-cases:
    name: Linux / ${{ matrix.arch }} / Cases / shard ${{ matrix.shard_index }}
    needs:
    - case-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.case-matrix.outputs.linux) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@1.89.0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Run cases
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix || fromJSON('{}')) }}
      run: >-
        python3 -m mesonbuild.mesonmain setup build-ci "-Dcompiler=false" "-Dci_family=test"
        "-Dci_target=${{ matrix.id }}" "-Dci_lanes=cases/cases-linux" "-Dci_provision=true"
        "-Dci_report=ci-report.json" && python3 -m mesonbuild.mesonmain compile -C build-ci ci
    - name: Upload source check report
      if: ${{ always() && matrix.id == 'linux-amd64' && matrix.shard_index == 0 }}
      uses: actions/upload-artifact@v6
      with:
        name: evidence-ci-${{ matrix.id }}-cases-source-checks
        path: wave-source-checks.json
        if-no-files-found: warn
    - name: Upload case report
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: evidence-ci-${{ matrix.id }}-cases-shard-${{ matrix.shard_index }}
        path: wave-cases-${{ matrix.id }}-shard-${{ matrix.shard_index }}.json
        if-no-files-found: warn
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-ci-${{ matrix.id }}-cases-shard-${{ matrix.shard_index }}
        path: |
          ci-report.json
          wave-corpus.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
  linux-loong64-cases:
    name: Linux / ${{ matrix.arch }} / Cases / shard ${{ matrix.shard_index }}
    needs:
    - case-matrix
