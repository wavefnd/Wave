      run: >-
        python3 -m mesonbuild.mesonmain setup build-ci "-Dcompiler=false" "-Dci_family=test"
        "-Dci_target=linux-loong64" "-Dci_lanes=rust/build-linux-loongarch64" "-Dci_provision=true"
        "-Dci_report=ci-report.json" && python3 -m mesonbuild.mesonmain compile -C build-ci ci
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-ci-linux-loong64-build
        path: |
          ci-report.json
          wave-corpus.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
