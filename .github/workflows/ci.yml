    - name: Build native Rust maintenance tool
      id: tooling_bootstrap
      shell: bash
      timeout-minutes: 10
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup build-ci -Dcompiler=false
        ./build-ci/wave-tools prepare tooling --github-env "$GITHUB_ENV"
        ./build-ci/wave-tools prepare pins --github-env "$GITHUB_ENV"
    - name: Install LLVM and isolated VM tools
      id: tools
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare host --target "$WAVE_CI_TARGET" --provision
    - name: Fetch and verify pinned FreeBSD image
      id: image
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" freebsd fetch-image --work-dir "$RUNNER_TEMP" --provision --github-env "$GITHUB_ENV"
    - name: Build compiler and validate VM reporting
      id: compiler
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup --reconfigure .tmp/meson/freebsd-build . -Dbuildtype=release -Dllvm_features=llvm-target-x86
        python -m mesonbuild.mesonmain compile -C .tmp/meson/freebsd-build --jobs 2 wavec
    - name: Execute FreeBSD providers at O0 and O2
      id: runtime
      shell: bash
      timeout-minutes: 30
      run: |
