          wave-v${{ inputs.version }}-aarch64-pc-windows-msvc.zip.sha256

          wave-v${{ inputs.version }}-aarch64-pc-windows-msvc.zip.metadata.json

          '
        if-no-files-found: error
      name: Upload package
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-release-windows-arm64-package
        path: 'ci-report.json

          ${{ runner.temp }}/wave-ci-*/*.log

          '
        if-no-files-found: warn
        retention-days: 7
    env:
      WAVE_CI_TARGET: windows-arm64
      WAVE_RELEASE_INPUTS: ${{ toJSON(inputs || fromJSON('{}')) }}
  freebsd-amd64-package:
    name: FreeBSD / amd64 / Package
    needs:
    - release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Setup pinned native Rust tooling
      uses: dtolnay/rust-toolchain@1.89.0
    - name: Build native Rust maintenance tool
      id: tooling_bootstrap
      shell: bash
      timeout-minutes: 10
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup build-ci -Dcompiler=false
        ./build-ci/wave-tools prepare tooling --github-env "$GITHUB_ENV"
        ./build-ci/wave-tools prepare pins --github-env "$GITHUB_ENV"
    - name: Resolve canonical distribution identity
      id: package_paths
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" ci artifact --target "$WAVE_CI_TARGET" --github-output "$GITHUB_OUTPUT"
    - name: Select pinned FreeBSD input cache
      id: freebsd-cache
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" freebsd cache-key --github-output "$GITHUB_OUTPUT"
    - name: Restore pinned FreeBSD build inputs
      uses: actions/cache@v5
      with:
        path: ${{ steps.freebsd-cache.outputs.path }}
        key: ${{ steps.freebsd-cache.outputs.key }}
        restore-keys: ${{ steps.freebsd-cache.outputs.restore-prefix }}
    - name: Prepare Linux cross-build tools and FreeBSD VM
      id: tools
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare host --target "$WAVE_CI_TARGET" --provision
    - name: Build FreeBSD package on Linux and validate in VM
      id: freebsd-package
      shell: bash
      timeout-minutes: 300
      run: |
        set -euo pipefail
        cargo "+$RUST_VERSION" build --locked --jobs 2 --release -p wave-tools
        target/release/wave-tools freebsd package --provision --output . --cache "$RUNNER_TEMP/wave-freebsd-cache"
    - name: Record native Actions outcomes
      id: ci_report
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" ci report --target-id "$WAVE_CI_TARGET" --output ci-report.json
      env:
        WAVE_STEP_OUTCOMES: ${{ toJSON(steps) }}
      if: |-
        ${{ always() && steps.tooling_bootstrap.outcome == 'success' }}
    - uses: actions/upload-artifact@v6
      with:
        name: release-package-freebsd-amd64
        path: wave-v${{ inputs.version }}-x86_64-unknown-freebsd.tar.gz*
        if-no-files-found: error
        retention-days: 7
      name: Upload package
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-release-freebsd-amd64-package
        path: 'ci-report.json

          ${{ runner.temp }}/wave-ci-*/*.log

          ${{ runner.temp }}/wave-ci-freebsd-package-*/*.json'
        if-no-files-found: warn
        retention-days: 7
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      WAVE_CI_TARGET: freebsd-amd64
      WAVE_RELEASE_INPUTS: ${{ toJSON(inputs || fromJSON('{}')) }}
  publish:
    name: Shared / Publish
    needs:
    - release-gate
    - linux-amd64-validate
    - linux-riscv64-validate
    - linux-loong64-validate
    - linux-native-package
    - linux-riscv64-package
    - linux-loong64-package
    - macos-native-package
    - windows-amd64-package
    - windows-arm64-package
    - freebsd-amd64-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Setup pinned native Rust tooling
      uses: dtolnay/rust-toolchain@1.89.0
    - name: Build native Rust maintenance tool
      id: tooling_bootstrap
      shell: bash
      timeout-minutes: 10
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup build-ci -Dcompiler=false
        ./build-ci/wave-tools prepare tooling --github-env "$GITHUB_ENV"
        ./build-ci/wave-tools prepare pins --github-env "$GITHUB_ENV"
    - uses: actions/download-artifact@v7
      with:
        pattern: release-package-*
        path: release-assets
        merge-multiple: true
    - name: Verify release assets
      id: stage-3
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" check release-assets --directory release-assets --version "$RELEASE_VERSION"
    - name: Create GitHub release
      id: stage-4
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" release --stage publish --publish
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Record native Actions outcomes
      id: ci_report
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" ci report --target-id "$WAVE_CI_TARGET" --output ci-report.json
      env:
        WAVE_STEP_OUTCOMES: ${{ toJSON(steps) }}
      if: |-
        ${{ always() && steps.tooling_bootstrap.outcome == 'success' }}
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-release-shared-publish
        path: 'ci-report.json

          ${{ runner.temp }}/wave-ci-*/*.log

          '
        if-no-files-found: warn
        retention-days: 7
    env:
      WAVE_CI_TARGET: linux-amd64
      WAVE_RELEASE_INPUTS: ${{ toJSON(inputs || fromJSON('{}')) }}
