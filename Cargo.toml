[package]
name = "wavec"
version = "0.0.1-alpha-dev"
edition = "2021"

[lib]
name = "wavec"
path = "src/lib.rs"

[dependencies]
utils = { path = "utils" }
lexer = { path = "front/lexer" }
parser = { path = "front/parser" }
hir = { path = "front/hir" }
error = { path = "front/error" }
llvm = { path = "./llvm", default-features = false }
whale = { path = "./whale" }

[features]
default = ["llvm-target-core64", "llvm-target-loongarch", "llvm-target-wasm"]
llvm-target-core64 = ["llvm-target-x86", "llvm-target-aarch64", "llvm-target-riscv"]
llvm-target-all = ["llvm/llvm-target-all"]
llvm-target-aarch64 = ["llvm/llvm-target-aarch64"]
llvm-target-loongarch = ["llvm/llvm-target-loongarch"]
llvm-target-riscv = ["llvm/llvm-target-riscv"]
llvm-target-wasm = ["llvm/llvm-target-wasm"]
llvm-target-x86 = ["llvm/llvm-target-x86"]

[dev-dependencies]
wave-tools = { path = "tools" }

[workspace]
members = [
    "tools",
    "front/lexer",
    "front/parser",
    "front/hir",
    "llvm",
    "whale",
    "front/error",
    "utils",
    ".",
]
