    - uses: actions/upload-artifact@v6
      with:
        name: release-package-windows-amd64
        path: 'wave-v${{ inputs.version }}-x86_64-pc-windows-msvc.zip

          wave-v${{ inputs.version }}-x86_64-pc-windows-msvc.zip.sha256

