version = 3

# List only existing OS ports or publicly documented porting work. Every listed
# cell must appear in both tables; false means planned in Wave, not an invented
# OS/architecture combination.
#
# Named processor/project cells remain planned until Wave and Whale define
# their target, ABI, and runtime contracts.
# OpenBSD: https://www.openbsd.org/plat.html
# NetBSD RISC-V: https://wiki.netbsd.org/ports/riscv/
# DragonFly amd64: https://www.dragonflybsd.org/docs/faq/FAQ-English/ (Wave #497)
# Android RISC-V: https://github.com/google/android-riscv64 (provisional ABI)
# Fuchsia RISC-V: https://fuchsia.dev/fuchsia-src/contribute/governance/rfcs/0211_fuchsia_on_risc-v
# iOS amd64 is reserved for the simulator, not physical iOS devices (Wave #473).
[supported]
linux        = { amd64 = true,  arm64 = true,  riscv64 = true, loong64 = true }
macos        = { amd64 = true,  arm64 = true }
windows      = { amd64 = true,  arm64 = true }
freebsd      = { amd64 = true,  arm64 = true,  riscv64 = true }
freestanding = { amd64 = true,  arm64 = false, riscv64 = false }
openbsd      = { amd64 = false, arm64 = false, riscv64 = false }
netbsd       = { amd64 = false, arm64 = false, riscv64 = false }
dragonfly    = { amd64 = false }
fuchsia      = { amd64 = false, arm64 = false, riscv64 = false }
android      = { amd64 = false, arm64 = false, riscv64 = false }
ios          = { amd64 = false, arm64 = false }
wasm         = { wasm32 = true, wasm64 = true }
wasi         = { wasm32 = true, wasm64 = false }

[ci]
linux        = { amd64 = true,  arm64 = true,  riscv64 = true, loong64 = true }
macos        = { amd64 = true,  arm64 = true }
windows      = { amd64 = true,  arm64 = true }
freebsd      = { amd64 = true,  arm64 = true,  riscv64 = true }
freestanding = { amd64 = true,  arm64 = false, riscv64 = false }
openbsd      = { amd64 = false, arm64 = false, riscv64 = false }
netbsd       = { amd64 = false, arm64 = false, riscv64 = false }
dragonfly    = { amd64 = false }
fuchsia      = { amd64 = false, arm64 = false, riscv64 = false }
android      = { amd64 = false, arm64 = false, riscv64 = false }
ios          = { amd64 = false, arm64 = false }
wasm         = { wasm32 = true, wasm64 = true }
wasi         = { wasm32 = true, wasm64 = false }

# Processor names are profiles of base ISAs, not architectures or compiler
# targets. They remain disabled until the compiler and runtime support them.
[profiles]
rhea      = { os = "linux", arch = "arm64",   supported = false, ci = false }
shakti    = { os = "linux", arch = "riscv64", supported = false, ci = false }
xiangshan = { os = "linux", arch = "riscv64", supported = false, ci = false }
t-head    = { os = "linux", arch = "riscv64", supported = false, ci = false }

# Only supported=true cells need execution details below. Every target gets
# shared, shared/<arch>, and <os>/<arch> suites automatically. Profile targets
# also get shared/<profile> and <os>/<profile> after the base suites.
# Support=false entries remain disabled planned targets.

[[target]]
id = "linux-amd64"
os = "linux"
arch = "amd64"
executor = "native"
capabilities = ["stdio", "filesystem", "environment", "clock", "sockets", "process"]
runner = "ubuntu-24.04"
ci_group = "linux"

[[target]]
id = "linux-arm64"
os = "linux"
arch = "arm64"
executor = "native"
capabilities = ["stdio", "filesystem", "environment", "clock", "sockets", "process"]
runner = "ubuntu-24.04-arm"
ci_group = "linux"

[[target]]
id = "linux-riscv64"
os = "linux"
arch = "riscv64"
executor = "qemu"
capabilities = ["stdio", "filesystem", "environment", "clock", "sockets", "process"]
runner = "ubuntu-24.04"
ci_group = "qemu"
target = "riscv64-unknown-linux-gnu"
smoke_case = "linux/riscv64/test2.wave"
smoke_stdout = "riscv packet=pass"

[[target]]
id = "linux-loong64"
os = "linux"
arch = "loong64"
executor = "qemu"
capabilities = ["stdio", "filesystem", "environment", "clock", "sockets", "process"]
runner = "ubuntu-24.04"
ci_group = "loongarch"
target = "loongarch64-unknown-linux-gnu"
smoke_case = "linux/loong64/test2.wave"
smoke_stdout = "loongarch workload=pass"

[[target]]
id = "macos-amd64"
os = "macos"
arch = "amd64"
executor = "native"
capabilities = ["stdio", "filesystem", "environment", "clock", "sockets", "process"]
runner = "macos-15-intel"
ci_group = "macos"

[[target]]
id = "macos-arm64"
os = "macos"
arch = "arm64"
executor = "native"
capabilities = ["stdio", "filesystem", "environment", "clock", "sockets", "process"]
runner = "macos-latest"
ci_group = "macos"

[[target]]
id = "windows-amd64"
target = "x86_64-pc-windows-msvc"
os = "windows"
arch = "amd64"
executor = "native"
capabilities = ["stdio", "filesystem", "environment", "clock", "sockets", "process"]
runner = "windows-latest"
ci_group = "windows"

[[target]]
id = "windows-arm64"
target = "aarch64-pc-windows-msvc"
os = "windows"
arch = "arm64"
executor = "native"
capabilities = ["stdio", "filesystem", "environment", "clock", "sockets", "process"]
runner = "windows-11-vs2026-arm"
ci_group = "windows_arm64"

[[target]]
id = "freebsd-amd64"
os = "freebsd"
arch = "amd64"
executor = "compile"
capabilities = []
runner = "ubuntu-24.04"
ci_group = "cross"
target = "x86_64-unknown-freebsd"

[[target]]
id = "freebsd-arm64"
os = "freebsd"
arch = "arm64"
executor = "compile"
capabilities = []
runner = "ubuntu-24.04"
ci_group = "cross"
target = "aarch64-unknown-freebsd"

[[target]]
id = "freebsd-riscv64"
os = "freebsd"
arch = "riscv64"
executor = "compile"
capabilities = []
runner = "ubuntu-24.04"
ci_group = "cross"
target = "riscv64-unknown-freebsd"

[[target]]
id = "freestanding-amd64"
os = "freestanding"
arch = "amd64"
executor = "compile"
capabilities = []
runner = "ubuntu-24.04"
ci_group = "cross"
target = "x86_64-unknown-none-elf"
exclude = ["shared/test142.wave"] # No process environment provider.

[[target]]
id = "wasm-unknown"
os = "wasm"
arch = "wasm32"
executor = "wasm"
capabilities = ["stdio"]
runner = "ubuntu-24.04"
ci_group = "wasm"
target = "wasm32-unknown-unknown"
exclude = ["shared/test142.wave"] # No process environment provider.

[[target]]
id = "wasm-wasi"
os = "wasi"
arch = "wasm32"
executor = "wasm"
capabilities = ["stdio", "filesystem", "environment", "clock"]
runner = "ubuntu-24.04"
ci_group = "wasm"
target = "wasm32-wasip1"

[[target]]
id = "wasm64-unknown"
os = "wasm"
arch = "wasm64"
executor = "wasm"
capabilities = ["stdio"]
runner = "ubuntu-24.04"
ci_group = "wasm"
target = "wasm64-unknown-unknown"
exclude = ["shared/test142.wave"] # No process environment provider.
