  freebsd-amd64-package:
    name: FreeBSD / amd64 / Package
    needs:
    - nightly-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ needs.nightly-gate.outputs.source_sha }}
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Setup pinned native Rust tooling
      uses: dtolnay/rust-toolchain@1.89.0
    - name: Build native Rust maintenance tool
      id: tooling_bootstrap
      shell: bash
      timeout-minutes: 10
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup build-ci -Dcompiler=false
        ./build-ci/wave-tools prepare tooling --github-env "$GITHUB_ENV"
        ./build-ci/wave-tools prepare pins --github-env "$GITHUB_ENV"
    - name: Resolve canonical distribution identity
      id: package_paths
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" ci artifact --target "$WAVE_CI_TARGET" --github-output "$GITHUB_OUTPUT"
    - name: Select FreeBSD VM cache
      id: freebsd-cache
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" freebsd cache-key --github-output "$GITHUB_OUTPUT"
    - name: Restore FreeBSD tools and Cargo cache
      uses: actions/cache@v5
      with:
        path: ${{ steps.freebsd-cache.outputs.path }}
        key: ${{ steps.freebsd-cache.outputs.key }}
        restore-keys: ${{ steps.freebsd-cache.outputs.restore-prefix }}
    - name: Verify exact canonical CI source
      id: verify_source
      shell: bash
      timeout-minutes: 3
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" nightly --stage verify-source
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Build and validate native FreeBSD package
      id: freebsd-package
      shell: bash
      timeout-minutes: 300
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage openssh-client xz-utils curl
        "$WAVE_TOOLS" freebsd package --provision --output . --cache "$RUNNER_TEMP/wave-freebsd-cache"
    - name: Record native Actions outcomes
      id: ci_report
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" ci report --target-id "$WAVE_CI_TARGET" --output ci-report.json
      env:
        WAVE_STEP_OUTCOMES: ${{ toJSON(steps) }}
      if: |-
        ${{ always() && steps.tooling_bootstrap.outcome == 'success' }}
    - uses: actions/upload-artifact@v6
      with:
        name: nightly-package-freebsd-amd64
        path: wave-v${{ needs.nightly-gate.outputs.compiler_version }}-x86_64-unknown-freebsd.tar.gz*
        if-no-files-found: error
        retention-days: 7
      name: Upload package
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-nightly-freebsd-amd64-package
        path: 'ci-report.json

          ${{ runner.temp }}/wave-ci-*/*.log'
        if-no-files-found: warn
        retention-days: 7
    env:
      RELEASE_VERSION: ${{ needs.nightly-gate.outputs.compiler_version }}
      WAVE_NIGHTLY_CI_RUN: ${{ needs.nightly-gate.outputs.ci_run_id }}
      WAVE_CI_TARGET: freebsd-amd64
  publish:
    name: Shared / Publish
    needs:
    - nightly-gate
    - linux-native-package
    - linux-loong64-package
    - linux-riscv64-package
    - macos-native-package
    - windows-amd64-package
    - windows-arm64-package
    - freebsd-amd64-package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    concurrency:
      group: wave-nightly-publish
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.nightly-gate.outputs.source_sha }}
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Setup pinned native Rust tooling
      uses: dtolnay/rust-toolchain@1.89.0
    - name: Build native Rust maintenance tool
      id: tooling_bootstrap
      shell: bash
      timeout-minutes: 10
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup build-ci -Dcompiler=false
        ./build-ci/wave-tools prepare tooling --github-env "$GITHUB_ENV"
        ./build-ci/wave-tools prepare pins --github-env "$GITHUB_ENV"
    - uses: actions/download-artifact@v7
      with:
        pattern: nightly-package-*
        path: release-assets
        merge-multiple: true
    - name: Promote the complete Nightly generation
      id: publish
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" nightly --stage publish --publish
      env:
        GH_TOKEN: ${{ github.token }}
        WAVE_NIGHTLY_CI_RUN: ${{ needs.nightly-gate.outputs.ci_run_id }}
    env:
      WAVE_CI_TARGET: linux-amd64
