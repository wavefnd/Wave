name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Cargo version without the v prefix (for example: 0.2.0-pre-beta)"
        required: true
        type: string
      draft:
        description: "Create the GitHub release as a draft"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: manual-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  NO_COLOR: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  LLVM_VERSION: "21"
  LLVM_PREFIX_LINUX: "/usr/lib/llvm-21"
  LLVM_MINGW_VERSION: "20251216"
  LLVM_MINGW_SHA256: "c892f0155c2201c43257b2c5d1e12b899229d8dc957aa3e5937ce00e3ca09e91"
  LLVM_WINDOWS_ARM64_VERSION: "21.1.8"
  LLVM_WINDOWS_ARM64_SHA256: "f214b1226d8de005b5f691dd29d9dfea2b49e22d0de445429916173dbb626f7f"
  LLVM_MINGW_ARM64_SHA256: "60c06bd255feb2ef1eb6fce7ee6b307d8f78ee6639660f49861c7c10a8a86164"
  LOONGARCH_TOOLCHAIN_VERSION: "2025.08.08"
  LOONGARCH_TOOLCHAIN_ARCHIVE: "x86_64-cross-tools-loongarch64-binutils_2.45-gcc_15.1.0-glibc_2.42.tar.xz"
  LOONGARCH_TOOLCHAIN_SHA256: "b8572e2083143ff1807658f02e11eba53e5ed81d6194854d369b43fceea72de7"
  LLVM_SOURCE_VERSION: "21.1.8"
  LLVM_SOURCE_SHA256: "4633a23617fa31a3ea51242586ea7fb1da7140e426bd62fc164261fe036aa142"
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate branch, version, and tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "Release workflow must run from master, got: $GITHUB_REF" >&2
            exit 1
          fi

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 1
          fi
          if [[ "$RELEASE_VERSION" == *-dev ]]; then
            echo "Development version cannot be released: $RELEASE_VERSION" >&2
            exit 1
          fi

          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          if [[ "$cargo_version" != "$RELEASE_VERSION" ]]; then
            echo "Cargo.toml version is $cargo_version, input is $RELEASE_VERSION" >&2
            exit 1
          fi

          tag="v$RELEASE_VERSION"
          remote_tag="$(git ls-remote --tags origin "refs/tags/$tag")"
          if [[ -n "$remote_tag" ]]; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi

      - name: Install LLVM 21
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            wget \
            software-properties-common \
            ca-certificates \
            gnupg \
            libffi-dev \
            libzstd-dev \
            zlib1g-dev

          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"

          sudo apt-get update
          sudo apt-get install -y \
            clang-"$LLVM_VERSION" \
            lld-"$LLVM_VERSION" \
            llvm-"$LLVM_VERSION" \
            llvm-"$LLVM_VERSION"-dev

          echo "LLVM_SYS_211_PREFIX=$LLVM_PREFIX_LINUX" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG_PATH=$LLVM_PREFIX_LINUX/bin/llvm-config" >> "$GITHUB_ENV"
          echo "$LLVM_PREFIX_LINUX/bin" >> "$GITHUB_PATH"

          mkdir -p "$RUNNER_TEMP/wave-llvm-bin"

          if [[ -x "$LLVM_PREFIX_LINUX/bin/ld64.lld" ]]; then
            ln -sf "$LLVM_PREFIX_LINUX/bin/ld64.lld" "$RUNNER_TEMP/wave-llvm-bin/ld64.lld"
          elif [[ -x "$LLVM_PREFIX_LINUX/bin/ld.lld" ]]; then
            ln -sf "$LLVM_PREFIX_LINUX/bin/ld.lld" "$RUNNER_TEMP/wave-llvm-bin/ld64.lld"
          elif command -v ld64.lld >/dev/null 2>&1; then
            ln -sf "$(command -v ld64.lld)" "$RUNNER_TEMP/wave-llvm-bin/ld64.lld"
          elif command -v ld.lld >/dev/null 2>&1; then
            ln -sf "$(command -v ld.lld)" "$RUNNER_TEMP/wave-llvm-bin/ld64.lld"
          elif command -v lld >/dev/null 2>&1; then
            ln -sf "$(command -v lld)" "$RUNNER_TEMP/wave-llvm-bin/ld64.lld"
          fi

          echo "$RUNNER_TEMP/wave-llvm-bin" >> "$GITHUB_PATH"
          echo "WAVE_LD64_LLD=$RUNNER_TEMP/wave-llvm-bin/ld64.lld" >> "$GITHUB_ENV"

      - name: Verify LLVM tools
        shell: bash
        run: |
          set -euo pipefail
          llvm-config --version
          clang --version
          command -v ld.lld || true
          command -v ld64.lld || true
          test -x "$WAVE_LD64_LLD"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check standard library policy
        run: ./tools/check_std_policy.sh

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build warning-free Rust documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps --jobs 2

      - name: Validate Python tooling
        run: |
          python3 -m py_compile x.py tools/check_wave_corpus.py tools/case_manifest.py tools/populate_case_matrix.py tools/run_tests.py tools/test_contracts.py tools/test_case_manifest.py tools/test_test_contracts.py
          python3 -m unittest tools.test_case_manifest tools.test_test_contracts

      - name: Run Rust tests
        run: cargo test --locked --all-targets --verbose

      - name: Build release compiler
        run: cargo build --locked --release --verbose

      - name: Install Wave stdlib
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.wave/lib/wave"
          rm -rf "$HOME/.wave/lib/wave/std"
          cp -R std "$HOME/.wave/lib/wave/std"

      - name: Print compiler version
        shell: bash
        run: |
          set -euo pipefail
          target/release/wavec -V

      - name: Check examples and standard library corpus
        run: >-
          python3 tools/check_wave_corpus.py --wavec target/release/wavec
          --run-std-examples

      - name: Run Wave end-to-end tests
        run: python3 tools/run_tests.py --report-json wave-e2e-report.json

      - name: Upload Wave end-to-end report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-e2e
          path: wave-e2e-report.json
          if-no-files-found: warn
          retention-days: 7

  validate-riscv64:
    name: Validate Linux RISC-V 64 release path
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Install LLVM 21 and RISC-V runtime tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y wget software-properties-common
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y \
            binutils-riscv64-linux-gnu \
            gcc-riscv64-linux-gnu \
            libc6-dev-riscv64-cross \
            lld-"$LLVM_VERSION" \
            qemu-user

          echo "LLVM_SYS_211_PREFIX=$LLVM_PREFIX_LINUX" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG_PATH=$LLVM_PREFIX_LINUX/bin/llvm-config" >> "$GITHUB_ENV"
          echo "$LLVM_PREFIX_LINUX/bin" >> "$GITHUB_PATH"

      - name: Verify RISC-V toolchain
        shell: bash
        run: |
          set -euo pipefail
          llvm-config --version
          ld.lld --version
          riscv64-linux-gnu-gcc --version
          riscv64-linux-gnu-readelf --version
          qemu-riscv64 --version

      - name: Install Wave stdlib
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.wave/lib/wave"
          rm -rf "$HOME/.wave/lib/wave/std"
          cp -R std "$HOME/.wave/lib/wave/std"

      - name: Build release compiler
        run: cargo build --locked --release --jobs 2

      - name: Build RISC-V-only LLVM feature set
        run: >-
          cargo build --locked --no-default-features
          --features llvm-target-riscv --jobs 2

      - name: Build core 64-bit LLVM feature set
        run: >-
          cargo build --locked --no-default-features
          --features llvm-target-core64 --jobs 2

      - name: Run RISC-V contract tests
        env:
          WAVE_RUN_RISCV64_INTEROP_TESTS: "1"
        run: >-
          cargo test --locked --test codegen_regressions
          riscv64_ --jobs 2 --verbose

      - name: Link and run Linux riscv64 Hello World
        shell: bash
        run: |
          set -euo pipefail

          riscv_sysroot="$(target/release/wavec print sysroot \
            --target riscv64-unknown-linux-gnu)"
          test "$riscv_sysroot" = /usr/riscv64-linux-gnu
          output_dir="$RUNNER_TEMP/wave-linux-riscv64"
          binary="$output_dir/test2"
          mkdir -p "$output_dir"

          target/release/wavec build tests/cases/shared/test2.wave \
            --target riscv64-unknown-linux-gnu \
            --out-dir "$output_dir"

          test -x "$binary"
          riscv64-linux-gnu-readelf -h "$binary" \
            | grep -Eq 'Machine:[[:space:]]+RISC-V'
          riscv64-linux-gnu-readelf -h "$binary" \
            | grep -Eq 'Flags:[[:space:]]+0x5.*double-float ABI'
          riscv64-linux-gnu-readelf -l "$binary" \
            | grep -Fq '/lib/ld-linux-riscv64-lp64d.so.1'

          runtime_output="$(timeout --signal=TERM --kill-after=5s 30s \
            qemu-riscv64 -L "$riscv_sysroot" "$binary")"
          printf '%s\n' "$runtime_output"
          test "$runtime_output" = 'Hello World'

  validate-loongarch64:
    name: Validate Linux LoongArch64 release path
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Install LLVM 21, LLD, and QEMU
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget curl xz-utils software-properties-common qemu-user
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y lld-"$LLVM_VERSION"
          echo "LLVM_SYS_211_PREFIX=$LLVM_PREFIX_LINUX" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG_PATH=$LLVM_PREFIX_LINUX/bin/llvm-config" >> "$GITHUB_ENV"
          echo "$LLVM_PREFIX_LINUX/bin" >> "$GITHUB_PATH"

      - name: Install pinned official LoongArch64 toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$LOONGARCH_TOOLCHAIN_ARCHIVE"
          url="https://github.com/loongson/build-tools/releases/download/$LOONGARCH_TOOLCHAIN_VERSION/$LOONGARCH_TOOLCHAIN_ARCHIVE"
          curl -L --fail --retry 3 "$url" -o "$archive"
          echo "$LOONGARCH_TOOLCHAIN_SHA256  $archive" | sha256sum -c -
          install_root="$RUNNER_TEMP/wave-loongarch64-toolchain"
          mkdir -p "$install_root"
          tar -xf "$archive" -C "$install_root"
          toolchain="$install_root/cross-tools"
          test -x "$toolchain/bin/loongarch64-unknown-linux-gnu-gcc"
          echo "$toolchain/bin" >> "$GITHUB_PATH"
          echo "WAVE_LOONGARCH64_SYSROOT=$toolchain/target" >> "$GITHUB_ENV"

      - name: Install Wave stdlib
        run: |
          mkdir -p "$HOME/.wave/lib/wave"
          rm -rf "$HOME/.wave/lib/wave/std"
          cp -R std "$HOME/.wave/lib/wave/std"

      - name: Build compiler target sets
        run: |
          cargo build --locked --release --jobs 2
          cargo build --locked --no-default-features \
            --features llvm-target-loongarch --jobs 2

      - name: Run LoongArch64 contracts
        env:
          WAVE_RUN_LOONGARCH64_INTEROP_TESTS: "1"
        run: >-
          cargo test --locked --test codegen_regressions
          loongarch64 --jobs 2 -- --nocapture

      - name: Link and run Linux LoongArch64 Hello World
        shell: bash
        run: |
          set -euo pipefail
          sysroot="$(target/release/wavec print sysroot \
            --target loongarch64-unknown-linux-gnu)"
          test "$sysroot" = "$WAVE_LOONGARCH64_SYSROOT"
          output_dir="$RUNNER_TEMP/wave-linux-loongarch64"
          mkdir -p "$output_dir"
          target/release/wavec build tests/cases/shared/test2.wave \
            --target loongarch64-unknown-linux-gnu \
            --out-dir "$output_dir"
          binary="$output_dir/test2"
          loongarch64-unknown-linux-gnu-readelf -h "$binary" \
            | grep -Eq 'Flags:[[:space:]]+0x43.*DOUBLE-FLOAT.*OBJ-v1'
          loongarch64-unknown-linux-gnu-readelf -l "$binary" \
            | grep -Fq '/lib64/ld-linux-loongarch-lp64d.so.1'
          runtime_output="$(timeout --signal=TERM --kill-after=5s 30s \
            qemu-loongarch64 -L "$sysroot" "$binary")"
          printf '%s\n' "$runtime_output"
          test "$runtime_output" = 'Hello World'

  validate-windows-arm64:
    name: Validate Windows GNU ARM64 release path
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Install LLVM 21 and LLD
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget software-properties-common
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y lld-"$LLVM_VERSION"
          echo "LLVM_SYS_211_PREFIX=$LLVM_PREFIX_LINUX" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG_PATH=$LLVM_PREFIX_LINUX/bin/llvm-config" >> "$GITHUB_ENV"
          echo "$LLVM_PREFIX_LINUX/bin" >> "$GITHUB_PATH"

      - name: Install pinned LLVM 21 MinGW cross toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/llvm-mingw.tar.xz"
          toolchain="$RUNNER_TEMP/llvm-mingw"
          url="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-msvcrt-ubuntu-22.04-x86_64.tar.xz"
          curl --fail --location --retry 3 "$url" --output "$archive"
          echo "${LLVM_MINGW_SHA256}  $archive" | sha256sum --check
          mkdir -p "$toolchain"
          tar -xJf "$archive" --strip-components=1 -C "$toolchain"
          test -x "$toolchain/bin/aarch64-w64-mingw32-gcc"
          echo "$toolchain/bin" >> "$GITHUB_PATH"
          echo "WAVE_WINDOWS_ARM64_LINKER=$toolchain/bin/aarch64-w64-mingw32-gcc" >> "$GITHUB_ENV"

      - name: Install Wave stdlib
        shell: bash
        run: |
          mkdir -p "$HOME/.wave/lib/wave"
          rm -rf "$HOME/.wave/lib/wave/std"
          cp -R std "$HOME/.wave/lib/wave/std"

      - name: Build release compiler
        run: cargo build --locked --release --jobs 2

      - name: Link Windows ARM64 PE/COFF and C ABI fixture
        env:
          WAVE_RUN_WINDOWS_ARM64_INTEROP_TESTS: "1"
        run: >-
          cargo test --locked --test codegen_regressions
          windows_arm64_c_abi_links_with_mingw --jobs 2 -- --nocapture

  package-linux:
    name: Package Linux ${{ matrix.arch }}
    needs: [validate, validate-riscv64, validate-loongarch64, validate-windows-arm64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive_target: x86_64-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_target: aarch64-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.89.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            file \
            patchelf \
            wget \
            software-properties-common \
            ca-certificates \
            gnupg \
            libffi-dev \
            libzstd-dev \
            zlib1g-dev

          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"

          sudo apt-get update
          sudo apt-get install -y \
            clang-"$LLVM_VERSION" \
            lld-"$LLVM_VERSION" \
            llvm-"$LLVM_VERSION" \
            llvm-"$LLVM_VERSION"-dev

          echo "LLVM_SYS_211_PREFIX=$LLVM_PREFIX_LINUX" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG_PATH=$LLVM_PREFIX_LINUX/bin/llvm-config" >> "$GITHUB_ENV"
          echo "$LLVM_PREFIX_LINUX/bin" >> "$GITHUB_PATH"

          mkdir -p "$RUNNER_TEMP/wave-llvm-bin"

          if [[ -x "$LLVM_PREFIX_LINUX/bin/ld64.lld" ]]; then
            ln -sf "$LLVM_PREFIX_LINUX/bin/ld64.lld" "$RUNNER_TEMP/wave-llvm-bin/ld64.lld"
          elif [[ -x "$LLVM_PREFIX_LINUX/bin/ld.lld" ]]; then
            ln -sf "$LLVM_PREFIX_LINUX/bin/ld.lld" "$RUNNER_TEMP/wave-llvm-bin/ld64.lld"
          elif command -v ld64.lld >/dev/null 2>&1; then
            ln -sf "$(command -v ld64.lld)" "$RUNNER_TEMP/wave-llvm-bin/ld64.lld"
          elif command -v ld.lld >/dev/null 2>&1; then
            ln -sf "$(command -v ld.lld)" "$RUNNER_TEMP/wave-llvm-bin/ld64.lld"
          elif command -v lld >/dev/null 2>&1; then
            ln -sf "$(command -v lld)" "$RUNNER_TEMP/wave-llvm-bin/ld64.lld"
          fi

          echo "$RUNNER_TEMP/wave-llvm-bin" >> "$GITHUB_PATH"
          echo "WAVE_LD64_LLD=$RUNNER_TEMP/wave-llvm-bin/ld64.lld" >> "$GITHUB_ENV"

      - name: Verify release tools
        shell: bash
        run: |
          set -euo pipefail
          llvm-config --version
          clang --version
          command -v ld.lld || true
          command -v ld64.lld || true
          test -x "$WAVE_LD64_LLD"
          ls -la "$LLVM_PREFIX_LINUX/bin" | grep -E 'lld|ld64|clang' || true

      - name: Build and package
        run: python3 x.py release "${{ matrix.target }}"

      - name: Smoke test packaged compiler
        shell: bash
        run: |
          set -euo pipefail

          archive="wave-v${RELEASE_VERSION}-${{ matrix.archive_target }}.tar.gz"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          tar -xzf "$archive" -C "$temp_dir"
          package="$temp_dir/wave-v${RELEASE_VERSION}-${{ matrix.archive_target }}"

          env -i PATH=/usr/bin:/bin HOME=/tmp "$package/wavec" -V
          for abi_flag in 'lp64s:0x41' 'lp64f:0x42' 'lp64d:0x43'; do
            abi="${abi_flag%%:*}"
            flag="${abi_flag##*:}"
            loong_crt="$package/crt/loongarch64-unknown-linux-gnu/$abi/crt1.o"
            test -f "$loong_crt"
            llvm-readelf -h "$loong_crt" \
              | grep -Eq 'Machine:[[:space:]]+LoongArch'
            llvm-readelf -h "$loong_crt" \
              | grep -Eq "Flags:[[:space:]]+$flag"
          done

          printf 'fun main() { println("release smoke"); }\n' > "$temp_dir/smoke.wave"
          env -i PATH=/usr/bin:/bin HOME=/tmp "$package/wavec" run "$temp_dir/smoke.wave" \
            | grep -Fx "release smoke"

          sha256sum "$archive" > "$archive.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            wave-v${{ inputs.version }}-${{ matrix.archive_target }}.tar.gz
            wave-v${{ inputs.version }}-${{ matrix.archive_target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  package-linux-riscv64:
    name: Package Linux riscv64
    needs: [validate, validate-riscv64, validate-loongarch64, validate-windows-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Enable RISC-V container execution
        uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64

      - name: Build and smoke-test the native RISC-V release
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/riscv64 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            ubuntu:26.04 \
            bash tools/package_linux_riscv64.sh "$RELEASE_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-riscv64
          path: |
            wave-v${{ inputs.version }}-riscv64-linux-gnu.tar.gz
            wave-v${{ inputs.version }}-riscv64-linux-gnu.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  package-linux-loongarch64:
    name: Package Linux loong64
    needs: [validate, validate-riscv64, validate-loongarch64, validate-windows-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Enable LoongArch64 compiler execution
        uses: docker/setup-qemu-action@v3
        with:
          platforms: loong64

      - name: Install host build and emulation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            file \
            ninja-build \
            patchelf \
            python3 \
            qemu-user \
            tar \
            wget \
            xz-utils

          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y llvm-"$LLVM_VERSION"

      - name: Cache cross-built LoongArch64 LLVM
        uses: actions/cache@v4
        with:
          path: /tmp/wave-loongarch64-release
          key: loongarch64-llvm-${{ runner.os }}-${{ env.LLVM_SOURCE_VERSION }}-${{ hashFiles('tools/package_linux_loongarch64.sh') }}

      - name: Build and smoke-test native LoongArch64 release
        shell: bash
        env:
          WAVE_REQUIRE_LOONGARCH64_BINFMT: "1"
        run: bash tools/package_linux_loongarch64.sh "$RELEASE_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-loongarch64
          path: |
            wave-v${{ inputs.version }}-loongarch64-linux-gnu.tar.gz
            wave-v${{ inputs.version }}-loongarch64-linux-gnu.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  package-macos:
    name: Package macOS ${{ matrix.arch }}
    needs: [validate, validate-riscv64, validate-loongarch64, validate-windows-arm64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.89.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LLVM 21 and LLD
        shell: bash
        run: |
          set -euo pipefail

          brew update
          brew install llvm@21 lld

          llvm_prefix="$(brew --prefix llvm@21)"
          lld_prefix="$(brew --prefix lld)"

          echo "LLVM_SYS_211_PREFIX=$llvm_prefix" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG_PATH=$llvm_prefix/bin/llvm-config" >> "$GITHUB_ENV"
          echo "$llvm_prefix/bin" >> "$GITHUB_PATH"
          echo "$lld_prefix/bin" >> "$GITHUB_PATH"

          mkdir -p "$RUNNER_TEMP/wave-llvm-bin"

          if [[ -x "$lld_prefix/bin/ld64.lld" ]]; then
            ln -sf "$lld_prefix/bin/ld64.lld" "$RUNNER_TEMP/wave-llvm-bin/ld64.lld"
          elif [[ -x "$llvm_prefix/bin/ld64.lld" ]]; then
            ln -sf "$llvm_prefix/bin/ld64.lld" "$RUNNER_TEMP/wave-llvm-bin/ld64.lld"
          elif [[ -x "$lld_prefix/bin/ld.lld" ]]; then
            ln -sf "$lld_prefix/bin/ld.lld" "$RUNNER_TEMP/wave-llvm-bin/ld64.lld"
          elif [[ -x "$llvm_prefix/bin/ld.lld" ]]; then
            ln -sf "$llvm_prefix/bin/ld.lld" "$RUNNER_TEMP/wave-llvm-bin/ld64.lld"
          elif command -v ld64.lld >/dev/null 2>&1; then
            ln -sf "$(command -v ld64.lld)" "$RUNNER_TEMP/wave-llvm-bin/ld64.lld"
          elif command -v ld.lld >/dev/null 2>&1; then
            ln -sf "$(command -v ld.lld)" "$RUNNER_TEMP/wave-llvm-bin/ld64.lld"
          elif command -v lld >/dev/null 2>&1; then
            ln -sf "$(command -v lld)" "$RUNNER_TEMP/wave-llvm-bin/ld64.lld"
          fi

          echo "$RUNNER_TEMP/wave-llvm-bin" >> "$GITHUB_PATH"
          echo "WAVE_LD64_LLD=$RUNNER_TEMP/wave-llvm-bin/ld64.lld" >> "$GITHUB_ENV"

      - name: Verify release tools
        shell: bash
        run: |
          set -euo pipefail
          llvm-config --version
          clang --version
          command -v ld64.lld || true
          test -x "$WAVE_LD64_LLD"
          "$WAVE_LD64_LLD" --version || true

      - name: Build and package
        run: python3 x.py release "${{ matrix.target }}"

      - name: Smoke test packaged compiler
        shell: bash
        run: |
          set -euo pipefail

          archive="wave-v${RELEASE_VERSION}-${{ matrix.target }}.tar.gz"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          tar -xzf "$archive" -C "$temp_dir"
          package="$temp_dir/wave-v${RELEASE_VERSION}-${{ matrix.target }}"

          env -i PATH=/usr/bin:/bin HOME=/tmp "$package/wavec" -V

          printf 'fun main() { println("release smoke"); }\n' > "$temp_dir/smoke.wave"
          env -i PATH=/usr/bin:/bin HOME=/tmp "$package/wavec" run "$temp_dir/smoke.wave" \
            | grep -Fx "release smoke"

          shasum -a 256 "$archive" > "$archive.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            wave-v${{ inputs.version }}-${{ matrix.target }}.tar.gz
            wave-v${{ inputs.version }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  package-windows:
    name: Package Windows x86_64
    needs: [validate, validate-riscv64, validate-loongarch64, validate-windows-arm64]
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            file
            unzip
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python
            mingw-w64-x86_64-llvm-21
            mingw-w64-x86_64-lld-21
            mingw-w64-x86_64-libffi
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-zlib

      - name: Install Rust GNU toolchain
        shell: msys2 {0}
        run: |
          set -euo pipefail

          rustup toolchain install 1.89.0-x86_64-pc-windows-gnu --profile minimal --force-non-host
          rustup target add x86_64-pc-windows-gnu --toolchain 1.89.0-x86_64-pc-windows-gnu
          rustup default 1.89.0-x86_64-pc-windows-gnu

      - name: Configure native Windows LLVM and MinGW runtime
        shell: msys2 {0}
        run: |
          set -euo pipefail

          llvm_root="$(cygpath -w /mingw64/opt/llvm-21)"
          llvm_bin="$(cygpath -w /mingw64/opt/llvm-21/bin)"
          llvm_config="$(cygpath -w /mingw64/opt/llvm-21/bin/llvm-config.exe)"

          mingw_bin="$(cygpath -w /mingw64/bin)"
          mingw_lib="$(cygpath -w /mingw64/lib)"
          mingw_pkgconfig="$(cygpath -w /mingw64/lib/pkgconfig)"

          rust_sysroot="$(rustc --print sysroot)"
          rust_target_lib="$rust_sysroot/lib/rustlib/x86_64-pc-windows-gnu/lib"

          crt2_path="$(find "$rust_target_lib" -name crt2.o -print -quit || true)"
          if [[ -z "$crt2_path" ]]; then
            echo "Could not find crt2.o under Rust target lib: $rust_target_lib" >&2
            find "$rust_target_lib" -maxdepth 4 -type f | sort | head -200 >&2 || true
            exit 1
          fi

          rust_mingw_self="$(dirname "$crt2_path")"

          echo "WAVE_LLVM_HOME=$llvm_root" >> "$GITHUB_ENV"
          echo "WAVE_WINDOWS_LLVM_BIN=$llvm_bin" >> "$GITHUB_ENV"
          echo "LLVM_SYS_211_PREFIX=$llvm_root" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG_PATH=$llvm_config" >> "$GITHUB_ENV"
          echo "WAVE_WINDOWS_MINGW_LIB=$(cygpath -w "$rust_mingw_self")" >> "$GITHUB_ENV"

          echo "$llvm_bin" >> "$GITHUB_PATH"
          echo "$mingw_bin" >> "$GITHUB_PATH"
          echo "$(cygpath -w /usr/bin)" >> "$GITHUB_PATH"

          echo "LIBRARY_PATH=$mingw_lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$mingw_pkgconfig" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-Lnative=$mingw_lib -lffi -lzstd -lz" >> "$GITHUB_ENV"

          echo "Rust sysroot: $rust_sysroot"
          echo "Rust target lib: $rust_target_lib"
          echo "Rust MinGW self-contained lib: $rust_mingw_self"
          ls -la "$rust_mingw_self" | head -100

      - name: Verify Windows release tools
        shell: msys2 {0}
        run: |
          set -euo pipefail

          rustc --version
          cargo --version
          llvm-config --version
          which gcc
          which clang || true
          which lld || true

          echo "WAVE_WINDOWS_MINGW_LIB=$WAVE_WINDOWS_MINGW_LIB"
          mingw_lib_posix="$(cygpath -u "$WAVE_WINDOWS_MINGW_LIB")"
          test -f "$mingw_lib_posix/crt2.o"
          ls -la "$mingw_lib_posix" | grep -E 'crt2|lib.*\.a' | head -100

          ls -la /mingw64/bin | grep -E 'libffi|libzstd|zlib|libgcc|libstdc|winpthread' || true
          ls -la /mingw64/lib | grep -E 'libffi|libzstd|libz\.' || true

      - name: Stage Windows runtime DLLs
        shell: msys2 {0}
        run: |
          set -euo pipefail

          llvm_bin="/mingw64/opt/llvm-21/bin"
          mingw_bin="/mingw64/bin"

          mkdir -p "$llvm_bin"

          for dll in \
            libffi-8.dll \
            libzstd.dll \
            zlib1.dll \
            libgcc_s_seh-1.dll \
            libstdc++-6.dll \
            libwinpthread-1.dll
          do
            if [[ -f "$mingw_bin/$dll" ]]; then
              cp -f "$mingw_bin/$dll" "$llvm_bin/$dll"
              echo "staged $dll"
            else
              echo "warning: $dll not found in $mingw_bin"
            fi
          done

          ls -la "$llvm_bin" | grep -E 'libffi|libzstd|zlib|libgcc|libstdc|winpthread' || true

      - name: Build and package
        shell: msys2 {0}
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python x.py release x86_64-pc-windows-gnu

      - name: Smoke test packaged compiler
        shell: msys2 {0}
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          set -euo pipefail

          archive="wave-v${RELEASE_VERSION}-x86_64-pc-windows-gnu.zip"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          unzip -q "$archive" -d "$temp_dir"
          package="$temp_dir/wave-v${RELEASE_VERSION}-x86_64-pc-windows-gnu"

          "$package/wavec.exe" -V

          printf 'fun main() { println("release smoke"); }\n' > "$temp_dir/smoke.wave"
          "$package/wavec.exe" run "$(cygpath -w "$temp_dir/smoke.wave")" | grep -Fx "release smoke"

          sha256sum "$archive" > "$archive.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: |
            wave-v${{ inputs.version }}-x86_64-pc-windows-gnu.zip
            wave-v${{ inputs.version }}-x86_64-pc-windows-gnu.zip.sha256
          if-no-files-found: error
          retention-days: 7

  package-windows-arm64:
    name: Package Windows ARM64
    needs: [validate, validate-riscv64, validate-loongarch64, validate-windows-arm64]
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.89.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned native LLVM 21 and llvm-mingw
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $llvmArchive = Join-Path $env:RUNNER_TEMP "llvm-arm64.tar.xz"
          $llvmDirectory = Join-Path $env:RUNNER_TEMP "llvm-arm64"
          $llvmUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_WINDOWS_ARM64_VERSION/clang%2Bllvm-$env:LLVM_WINDOWS_ARM64_VERSION-aarch64-pc-windows-msvc.tar.xz"
          curl.exe --fail --location --retry 3 $llvmUrl --output $llvmArchive
          if ((Get-FileHash $llvmArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:LLVM_WINDOWS_ARM64_SHA256) {
            throw "LLVM ARM64 archive checksum mismatch"
          }
          New-Item -ItemType Directory -Force -Path $llvmDirectory | Out-Null
          tar.exe -xJf $llvmArchive --strip-components=1 -C $llvmDirectory

          $mingwArchive = Join-Path $env:RUNNER_TEMP "llvm-mingw-arm64.zip"
          $mingwDirectory = Join-Path $env:RUNNER_TEMP "llvm-mingw-arm64"
          $mingwUrl = "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-aarch64.zip"
          curl.exe --fail --location --retry 3 $mingwUrl --output $mingwArchive
          if ((Get-FileHash $mingwArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:LLVM_MINGW_ARM64_SHA256) {
            throw "llvm-mingw ARM64 archive checksum mismatch"
          }
          Expand-Archive -Path $mingwArchive -DestinationPath $mingwDirectory -Force
          $mingwRoot = (Get-ChildItem $mingwDirectory -Directory | Select-Object -First 1).FullName

          @(
            "WAVE_LLVM_HOME=$llvmDirectory"
            "WAVE_WINDOWS_LLVM_BIN=$llvmDirectory\bin"
            "LLVM_SYS_211_PREFIX=$llvmDirectory"
            "LLVM_CONFIG_PATH=$llvmDirectory\bin\llvm-config.exe"
            "WAVE_WINDOWS_MINGW_ROOT=$mingwRoot"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$llvmDirectory\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Provision pinned ARM64 libxml2 for LLVM
        shell: pwsh
        run: ./tools/provision_windows_arm64_libxml2.ps1

      - name: Verify native ARM64 toolchains
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:PROCESSOR_ARCHITECTURE -ne "ARM64") { throw "Expected an ARM64 runner" }
          if ((rustc -vV | Select-String '^host: ').Line -ne "host: aarch64-pc-windows-msvc") {
            throw "Rust is not using the native Windows ARM64 host toolchain"
          }
          if (-not (Test-Path "$env:WAVE_WINDOWS_MINGW_ROOT\bin\aarch64-w64-mingw32-clang.exe")) {
            throw "Missing native ARM64 llvm-mingw driver"
          }
          & "$env:LLVM_CONFIG_PATH" --version

      - name: Build and package
        shell: pwsh
        run: python x.py release aarch64-pc-windows-msvc

      - name: Smoke test packaged compiler and linker
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "wave-v$env:RELEASE_VERSION-aarch64-pc-windows-msvc.zip"
          $temporary = Join-Path $env:RUNNER_TEMP "wave-arm64-smoke"
          Expand-Archive -Path $archive -DestinationPath $temporary -Force
          $package = Join-Path $temporary "wave-v$env:RELEASE_VERSION-aarch64-pc-windows-msvc"

          function Assert-Arm64Pe([string]$Path) {
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0xaa64) { throw "$Path is not an ARM64 PE image" }
          }

          $compiler = Join-Path $package "wavec.exe"
          Assert-Arm64Pe $compiler
          & $compiler -V

          $env:WAVE_WINDOWS_ARM64_LINKER = $null
          $source = Join-Path $temporary "smoke.wave"
          $outputDirectory = Join-Path $temporary "output"
          'fun main() { println("release smoke"); }' | Set-Content -Encoding utf8 $source
          $output = & $compiler build $source --run --out-dir $outputDirectory
          if ($LASTEXITCODE -ne 0 -or $output -ne "release smoke") {
            throw "Windows ARM64 packaged compiler smoke test failed: $output"
          }
          Assert-Arm64Pe (Join-Path $outputDirectory "smoke.exe")

          (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() + "  " + $archive |
            Set-Content -Encoding ascii "$archive.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-arm64
          path: |
            wave-v${{ inputs.version }}-aarch64-pc-windows-msvc.zip
            wave-v${{ inputs.version }}-aarch64-pc-windows-msvc.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Create GitHub release
    needs: [validate, validate-riscv64, validate-loongarch64, validate-windows-arm64, package-linux, package-linux-riscv64, package-linux-loongarch64, package-macos, package-windows, package-windows-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail

          test -f "wave-v${RELEASE_VERSION}-x86_64-linux-gnu.tar.gz"
          test -f "wave-v${RELEASE_VERSION}-aarch64-linux-gnu.tar.gz"
          test -f "wave-v${RELEASE_VERSION}-riscv64-linux-gnu.tar.gz"
          test -f "wave-v${RELEASE_VERSION}-loongarch64-linux-gnu.tar.gz"
          test -f "wave-v${RELEASE_VERSION}-x86_64-pc-windows-gnu.zip"
          test -f "wave-v${RELEASE_VERSION}-aarch64-pc-windows-msvc.zip"
          test -f "wave-v${RELEASE_VERSION}-aarch64-apple-darwin.tar.gz"
          test -f "wave-v${RELEASE_VERSION}-x86_64-apple-darwin.tar.gz"

          for archive in *.tar.gz *.zip; do
            test -f "$archive.sha256"
          done

          cat ./*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="v$RELEASE_VERSION"

          args=(
            release create "$tag"
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/SHA256SUMS
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "Wave $tag"
            --generate-notes
          )

          if [[ "${{ inputs.draft }}" == "true" ]]; then
            args+=(--draft)
          fi

          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
