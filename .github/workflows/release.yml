    name: Windows / amd64 / Package
    needs:
    - release-gate
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@1.89.0
      with:
        toolchain: 1.89.0-x86_64-pc-windows-msvc
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        architecture: x64
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build native Rust maintenance tool
      id: tooling_bootstrap
      shell: pwsh
      timeout-minutes: 10
      run: |
        $ErrorActionPreference = "Stop"
        & 'python' '-m' 'mesonbuild.mesonmain' 'setup' 'build-ci' '-Dcompiler=false'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & './build-ci/wave-tools.exe' 'prepare' 'tooling' '--github-env' "$env:GITHUB_ENV"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & './build-ci/wave-tools.exe' 'prepare' 'pins' '--github-env' "$env:GITHUB_ENV"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Resolve canonical distribution identity
      id: package_paths
      shell: pwsh
      timeout-minutes: 30
      run: |
        $ErrorActionPreference = "Stop"
        & $env:WAVE_TOOLS 'ci' 'artifact' '--target' "$env:WAVE_CI_TARGET" '--github-output' "$env:GITHUB_OUTPUT"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Install pinned native LLVM SDK
      id: stage-3
      shell: pwsh
      timeout-minutes: 30
      run: |
        $ErrorActionPreference = "Stop"
        & 'pwsh' '-NoProfile' '-File' './tools/provision_windows_msvc_llvm.ps1' '-Architecture' 'x64'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Provision matching LLVM dependencies and MSVC environment
      id: stage-4
      shell: pwsh
      timeout-minutes: 30
      run: |
        $ErrorActionPreference = "Stop"
        & 'pwsh' '-NoProfile' '-File' './tools/provision_windows_msvc_libxml2.ps1' '-Architecture' 'x64'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Install Wave standard library
      id: stage-5
      shell: pwsh
      timeout-minutes: 30
      run: |
        $ErrorActionPreference = "Stop"
        & $env:WAVE_TOOLS 'prepare' 'std'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Build native MSVC compiler
      id: stage-6
      shell: pwsh
      timeout-minutes: 30
      run: |
        $ErrorActionPreference = "Stop"
        & 'python' '-m' 'mesonbuild.mesonmain' 'setup' '--reconfigure' '.tmp/meson/build_release_compiler_3-0' '.' '-Dcompiler_target=x86_64-pc-windows-msvc' '-Dbuildtype=release' '-Dllvm_features=llvm-target-core64'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & 'python' '-m' 'mesonbuild.mesonmain' 'compile' '-C' '.tmp/meson/build_release_compiler_3-0' '--jobs' '2' 'wavec'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Execute native CRT, ABI, stack, DLL and response-file acceptance
      id: native_acceptance
      shell: pwsh
      timeout-minutes: 20
      run: |
        $ErrorActionPreference = "Stop"
        & $env:WAVE_TOOLS 'msvc-acceptance' '--wavec' 'target/x86_64-pc-windows-msvc/release/wavec.exe' '--llvm-bin' "$env:WAVE_WINDOWS_LLVM_BIN" '--target' 'x86_64-pc-windows-msvc' '--output' "$env:RUNNER_TEMP/wave-msvc-native-x64"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Execute complete Windows case selection
      id: stage-9
      shell: pwsh
      timeout-minutes: 30
      run: |
        $ErrorActionPreference = "Stop"
        & $env:WAVE_TOOLS 'test' '--wavec' 'target/x86_64-pc-windows-msvc/release/wavec.exe' '--target-id' 'windows-amd64' '--report-json' 'wave-cases-windows-amd64.json'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Stage native MSVC release package
      id: stage-11
      shell: pwsh
      timeout-minutes: 30
      run: |
        $ErrorActionPreference = "Stop"
        & 'python' '-m' 'mesonbuild.mesonmain' 'setup' '--reconfigure' '.tmp/meson/stage_native_msvc_release_package-0' '.' '-Dcompiler_target=x86_64-pc-windows-msvc' '-Dbuildtype=release' '-Dllvm_features=auto'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & 'python' '-m' 'mesonbuild.mesonmain' 'compile' '-C' '.tmp/meson/stage_native_msvc_release_package-0' '--jobs' '2' 'package-existing'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Verify extracted package in a controlled environment
      id: package_smoke
      shell: pwsh
      timeout-minutes: 10
      run: |
        $ErrorActionPreference = "Stop"
        & $env:WAVE_TOOLS 'check' 'extracted-package' '--archive' "$env:WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_ARCHIVE" '--target' "$env:WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_TARGET" '--output' "$env:RUNNER_TEMP/wave-package-x64"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      env:
        WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_ARCHIVE: ${{ steps.package_paths.outputs.archive }}
        WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_TARGET: ${{ steps.package_paths.outputs.target }}
    - name: Record native Actions outcomes
      id: ci_report
      shell: pwsh
      timeout-minutes: 30
      run: |
        $ErrorActionPreference = "Stop"
        & $env:WAVE_TOOLS 'ci' 'report' '--target-id' "$env:WAVE_CI_TARGET" '--output' 'ci-report.json'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      env:
        WAVE_STEP_OUTCOMES: ${{ toJSON(steps) }}
      if: |-
