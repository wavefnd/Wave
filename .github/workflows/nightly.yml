# SPDX-License-Identifier: MPL-2.0
name: Wave Nightly
'on':
  workflow_run:
    workflows:
    - Wave CI
    types:
    - completed
    branches:
    - master
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful canonical master Wave CI run ID to retry
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  NO_COLOR: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:

  # Shared
  nightly-gate:
    name: Shared / Nightly gate
    if: |-
      ${{ github.repository == 'wavefnd/Wave' &&
          ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
           (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_repository.full_name == 'wavefnd/Wave' &&
            github.event.workflow_run.head_branch == 'master')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.gate.outputs.source_sha }}
      compiler_version: ${{ steps.gate.outputs.compiler_version }}
      ci_run_id: ${{ steps.gate.outputs.ci_run_id }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: master
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Validate canonical CI source and installer deployment
      id: gate
      env:
        GH_TOKEN: ${{ github.token }}
        WAVE_NIGHTLY_CI_RUN: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
      run: python -m tools.ci.release --channel nightly --stage gate

  # Linux
  linux-native-package:
    name: Linux / ${{ matrix.display_arch }} / Package
    needs:
    - nightly-gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          display_arch: amd64
          runner: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
          archive_target: x86_64-linux-gnu
        - arch: arm64
          display_arch: arm64
          runner: ubuntu-24.04-arm
          target: aarch64-unknown-linux-gnu
          archive_target: aarch64-linux-gnu
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.nightly-gate.outputs.source_sha }}
        persist-credentials: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build and verify package
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix || fromJSON('{}')) }}
        GH_TOKEN: ${{ github.token }}
      run: python -m tools.ci.release --channel nightly --stage package --target "${{ matrix.target }}" --provision
        --report-json ci-report.json
    - uses: actions/upload-artifact@v6
      with:
        name: nightly-package-linux-${{ matrix.display_arch }}
        path: |
          wave-v${{ needs.nightly-gate.outputs.compiler_version }}-${{ matrix.archive_target }}.tar.gz
          wave-v${{ needs.nightly-gate.outputs.compiler_version }}-${{ matrix.archive_target }}.tar.gz.sha256
          wave-v${{ needs.nightly-gate.outputs.compiler_version }}-${{ matrix.archive_target }}.tar.gz.metadata.json
        if-no-files-found: error
        retention-days: 7
      name: Upload package
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-nightly-linux-${{ matrix.display_arch }}-package
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
    env:
      RELEASE_VERSION: ${{ needs.nightly-gate.outputs.compiler_version }}
      WAVE_NIGHTLY_CI_RUN: ${{ needs.nightly-gate.outputs.ci_run_id }}
  linux-loong64-package:
    name: Linux / loong64 / Package
    needs:
    - nightly-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.nightly-gate.outputs.source_sha }}
        persist-credentials: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - name: Enable LoongArch64 compiler execution
      uses: docker/setup-qemu-action@v4
      with:
        platforms: loong64
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build and verify package
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix || fromJSON('{}')) }}
        GH_TOKEN: ${{ github.token }}
      run: python -m tools.ci.release --channel nightly --stage package --target "linux-loong64" --provision --report-json
        ci-report.json
    - uses: actions/upload-artifact@v6
      with:
        name: nightly-package-linux-loong64
        path: |
          wave-v${{ needs.nightly-gate.outputs.compiler_version }}-loongarch64-linux-gnu.tar.gz
          wave-v${{ needs.nightly-gate.outputs.compiler_version }}-loongarch64-linux-gnu.tar.gz.sha256
          wave-v${{ needs.nightly-gate.outputs.compiler_version }}-loongarch64-linux-gnu.tar.gz.metadata.json
        if-no-files-found: error
        retention-days: 7
      name: Upload package
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-nightly-linux-loong64-package
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
    env:
      RELEASE_VERSION: ${{ needs.nightly-gate.outputs.compiler_version }}
      WAVE_NIGHTLY_CI_RUN: ${{ needs.nightly-gate.outputs.ci_run_id }}
  linux-riscv64-package:
    name: Linux / riscv64 / Package
    needs:
    - nightly-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.nightly-gate.outputs.source_sha }}
        persist-credentials: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - name: Cache Cargo build inputs
      uses: actions/cache@v5
      with:
        path: |-
          ~/.cargo/registry
          ~/.cargo/git
          target/riscv64gc-unknown-linux-gnu
        key: nightly-cargo-riscv64-${{ hashFiles('Cargo.lock', 'tools/ci/toolchains.json', 'tools/ci/cross_package.py')
          }}-${{ github.sha }}
        restore-keys: nightly-cargo-riscv64-${{ hashFiles('Cargo.lock', 'tools/ci/toolchains.json', 'tools/ci/cross_package.py')
          }}-
    - name: Enable RISC-V container execution
      uses: docker/setup-qemu-action@v4
      with:
        platforms: riscv64
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build and verify package
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix || fromJSON('{}')) }}
        GH_TOKEN: ${{ github.token }}
      run: python -m tools.ci.release --channel nightly --stage package --target "linux-riscv64" --provision --report-json
        ci-report.json
    - uses: actions/upload-artifact@v6
      with:
        name: nightly-package-linux-riscv64
        path: |
          wave-v${{ needs.nightly-gate.outputs.compiler_version }}-riscv64-linux-gnu.tar.gz
          wave-v${{ needs.nightly-gate.outputs.compiler_version }}-riscv64-linux-gnu.tar.gz.sha256
          wave-v${{ needs.nightly-gate.outputs.compiler_version }}-riscv64-linux-gnu.tar.gz.metadata.json
        if-no-files-found: error
        retention-days: 7
      name: Upload package
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-nightly-linux-riscv64-package
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
    env:
      RELEASE_VERSION: ${{ needs.nightly-gate.outputs.compiler_version }}
      WAVE_NIGHTLY_CI_RUN: ${{ needs.nightly-gate.outputs.ci_run_id }}

  # macOS
  macos-native-package:
    name: macOS / ${{ matrix.display_arch }} / Package
    needs:
    - nightly-gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          display_arch: amd64
          runner: macos-15-intel
          target: x86_64-apple-darwin
        - arch: arm64
          display_arch: arm64
          runner: macos-15
          target: aarch64-apple-darwin
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.nightly-gate.outputs.source_sha }}
        persist-credentials: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build and verify package
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix || fromJSON('{}')) }}
        GH_TOKEN: ${{ github.token }}
      run: python -m tools.ci.release --channel nightly --stage package --target "${{ matrix.target }}" --provision
        --report-json ci-report.json
    - uses: actions/upload-artifact@v6
      with:
        name: nightly-package-macos-${{ matrix.display_arch }}
        path: |
          wave-v${{ needs.nightly-gate.outputs.compiler_version }}-${{ matrix.target }}.tar.gz
          wave-v${{ needs.nightly-gate.outputs.compiler_version }}-${{ matrix.target }}.tar.gz.sha256
          wave-v${{ needs.nightly-gate.outputs.compiler_version }}-${{ matrix.target }}.tar.gz.metadata.json
        if-no-files-found: error
        retention-days: 7
      name: Upload package
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-nightly-macos-${{ matrix.display_arch }}-package
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
    env:
      RELEASE_VERSION: ${{ needs.nightly-gate.outputs.compiler_version }}
      WAVE_NIGHTLY_CI_RUN: ${{ needs.nightly-gate.outputs.ci_run_id }}

  # Windows
  windows-amd64-package:
    name: Windows / amd64 / Package
    needs:
    - nightly-gate
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.nightly-gate.outputs.source_sha }}
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@1.89.0
      with:
        toolchain: 1.89.0-x86_64-pc-windows-msvc
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        architecture: x64
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build and verify package
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix || fromJSON('{}')) }}
        GH_TOKEN: ${{ github.token }}
      run: python -m tools.ci.release --channel nightly --stage package --target "windows-amd64" --provision --report-json
        ci-report.json
    - name: Preserve native execution evidence
      if: ${{ always() && steps.procedure.outputs.native_acceptance != 'skipped' }}
      uses: actions/upload-artifact@v6
      with:
        name: evidence-nightly-windows-amd64-package-native-tests
        path: ${{ runner.temp }}/wave-msvc-native-x64/
        retention-days: 7
    - name: Preserve case evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: evidence-nightly-windows-amd64-package-cases
        path: wave-cases-windows-amd64.json
    - name: Preserve package acceptance evidence
      if: ${{ always() && steps.procedure.outputs.package_smoke != 'skipped' }}
      uses: actions/upload-artifact@v6
      with:
        name: evidence-nightly-windows-amd64-package-package-tests
        path: ${{ runner.temp }}/wave-package-x64/
        retention-days: 7
    - uses: actions/upload-artifact@v6
      with:
        name: nightly-package-windows-amd64
        path: |
          wave-v${{ needs.nightly-gate.outputs.compiler_version }}-x86_64-pc-windows-msvc.zip
          wave-v${{ needs.nightly-gate.outputs.compiler_version }}-x86_64-pc-windows-msvc.zip.sha256
          wave-v${{ needs.nightly-gate.outputs.compiler_version }}-x86_64-pc-windows-msvc.zip.metadata.json
        if-no-files-found: error
      name: Upload package
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-nightly-windows-amd64-package
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
    env:
      RELEASE_VERSION: ${{ needs.nightly-gate.outputs.compiler_version }}
      WAVE_NIGHTLY_CI_RUN: ${{ needs.nightly-gate.outputs.ci_run_id }}
  windows-arm64-package:
    name: Windows / arm64 / Package
    needs:
    - nightly-gate
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.nightly-gate.outputs.source_sha }}
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@1.89.0
      with:
        toolchain: 1.89.0-aarch64-pc-windows-msvc
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        architecture: arm64
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build and verify package
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix || fromJSON('{}')) }}
        GH_TOKEN: ${{ github.token }}
      run: python -m tools.ci.release --channel nightly --stage package --target "windows-arm64" --provision --report-json
        ci-report.json
    - name: Preserve native execution evidence
      if: ${{ always() && steps.procedure.outputs.native_acceptance != 'skipped' }}
      uses: actions/upload-artifact@v6
      with:
        name: evidence-nightly-windows-arm64-package-native-tests
        path: ${{ runner.temp }}/wave-msvc-native-arm64/
        retention-days: 7
    - name: Preserve case evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: evidence-nightly-windows-arm64-package-cases
        path: wave-cases-windows-arm64.json
    - name: Preserve package acceptance evidence
      if: ${{ always() && steps.procedure.outputs.package_smoke != 'skipped' }}
      uses: actions/upload-artifact@v6
      with:
        name: evidence-nightly-windows-arm64-package-package-tests
        path: ${{ runner.temp }}/wave-package-arm64/
        retention-days: 7
    - uses: actions/upload-artifact@v6
      with:
        name: nightly-package-windows-arm64
        path: |
          wave-v${{ needs.nightly-gate.outputs.compiler_version }}-aarch64-pc-windows-msvc.zip
          wave-v${{ needs.nightly-gate.outputs.compiler_version }}-aarch64-pc-windows-msvc.zip.sha256
          wave-v${{ needs.nightly-gate.outputs.compiler_version }}-aarch64-pc-windows-msvc.zip.metadata.json
        if-no-files-found: error
      name: Upload package
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-nightly-windows-arm64-package
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
    env:
      RELEASE_VERSION: ${{ needs.nightly-gate.outputs.compiler_version }}
      WAVE_NIGHTLY_CI_RUN: ${{ needs.nightly-gate.outputs.ci_run_id }}

  # FreeBSD
  freebsd-amd64-package:
    name: FreeBSD / amd64 / Package
    needs:
    - nightly-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ needs.nightly-gate.outputs.source_sha }}
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Select FreeBSD VM cache
      id: freebsd-cache
      run: python3 -m tools.ci.freebsd_cache --github-output "$GITHUB_OUTPUT"
    - name: Restore FreeBSD tools and Cargo cache
      uses: actions/cache@v5
      with:
        path: ${{ steps.freebsd-cache.outputs.path }}
        key: ${{ steps.freebsd-cache.outputs.key }}
        restore-keys: ${{ steps.freebsd-cache.outputs.restore-prefix }}
    - name: Build and validate FreeBSD package
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 -m tools.ci.release --channel nightly --stage package --target freebsd-amd64 --provision --report-json
        ci-report.json
    - uses: actions/upload-artifact@v6
      with:
        name: nightly-package-freebsd-amd64
        path: wave-v${{ needs.nightly-gate.outputs.compiler_version }}-x86_64-unknown-freebsd.tar.gz*
        if-no-files-found: error
        retention-days: 7
      name: Upload package
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-nightly-freebsd-amd64-package
        path: |-
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
    env:
      RELEASE_VERSION: ${{ needs.nightly-gate.outputs.compiler_version }}
      WAVE_NIGHTLY_CI_RUN: ${{ needs.nightly-gate.outputs.ci_run_id }}

  # Publication
  publish:
    name: Shared / Publish
    needs:
    - nightly-gate
    - linux-native-package
    - linux-loong64-package
    - linux-riscv64-package
    - macos-native-package
    - windows-amd64-package
    - windows-arm64-package
    - freebsd-amd64-package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    concurrency:
      group: wave-nightly-publish
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.nightly-gate.outputs.source_sha }}
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - uses: actions/download-artifact@v7
      with:
        pattern: nightly-package-*
        path: release-assets
        merge-multiple: true
    - name: Promote the complete Nightly generation
      env:
        GH_TOKEN: ${{ github.token }}
        WAVE_NIGHTLY_CI_RUN: ${{ needs.nightly-gate.outputs.ci_run_id }}
      run: python -m tools.ci.release --channel nightly --stage publish --publish
