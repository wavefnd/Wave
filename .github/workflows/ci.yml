# SPDX-License-Identifier: MPL-2.0
name: Wave CI
'on':
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
permissions:
  contents: read
concurrency:
  group: wave-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
jobs:
  case-matrix:
    name: Shared / Case matrix
    runs-on: ubuntu-24.04
    outputs:
      linux: ${{ steps.procedure.outputs.linux }}
      macos: ${{ steps.procedure.outputs.macos }}
      windows: ${{ steps.procedure.outputs.windows }}
      windows_arm64: ${{ steps.procedure.outputs.windows_arm64 }}
      qemu: ${{ steps.procedure.outputs.qemu }}
      loongarch: ${{ steps.procedure.outputs.loongarch }}
      wasm: ${{ steps.procedure.outputs.wasm }}
      freebsd: ${{ steps.procedure.outputs.freebsd }}
      freestanding: ${{ steps.procedure.outputs.freestanding }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Setup pinned native Rust tooling
      uses: dtolnay/rust-toolchain@1.89.0
    - name: Build native Rust maintenance tool
      id: tooling_bootstrap
      shell: bash
      timeout-minutes: 10
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup build-ci -Dcompiler=false
        ./build-ci/wave-tools prepare tooling --github-env "$GITHUB_ENV"
        ./build-ci/wave-tools prepare pins --github-env "$GITHUB_ENV"
    - name: Validate manifest and generate matrices
      id: procedure
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" matrix --github-output "$GITHUB_OUTPUT"
    - name: Record native Actions outcomes
      id: ci_report
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" ci report --target-id "$WAVE_CI_TARGET" --output ci-report.json
      env:
        WAVE_STEP_OUTCOMES: ${{ toJSON(steps) }}
      if: |-
        ${{ always() && steps.tooling_bootstrap.outcome == 'success' }}
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-ci-shared-matrix
        path: 'ci-report.json

          wave-corpus.json

          ${{ runner.temp }}/wave-ci-*/*.log

          '
        if-no-files-found: warn
        retention-days: 7
    env:
      WAVE_CI_TARGET: linux-amd64
  linux-amd64-build:
    name: Linux / amd64 / Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v5
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
      with:
        components: rustfmt, clippy
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build native Rust maintenance tool
      id: tooling_bootstrap
      shell: bash
      timeout-minutes: 10
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup build-ci -Dcompiler=false
        ./build-ci/wave-tools prepare tooling --github-env "$GITHUB_ENV"
        ./build-ci/wave-tools prepare pins --github-env "$GITHUB_ENV"
    - name: Install LLVM 21
      id: stage-3
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare host --target "$WAVE_CI_TARGET" --provision
    - name: Install Wave stdlib
      id: stage-4
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare std
    - name: Check Rust formatting
      id: stage-5
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" maintain format --check
    - name: Check standard library policy
      id: stage-6
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" check std-policy
    - name: Build warning-free Rust documentation
      id: stage-7
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        cargo doc --locked --no-deps --jobs 2
      env:
        RUSTDOCFLAGS: -D warnings
    - name: Run Clippy
      id: stage-8
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        cargo clippy --jobs 2 --locked --all-targets -- -D warnings
    - name: Run native Rust tooling contracts
      id: stage-9
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain test -C build-ci --suite tooling --print-errorlogs
    - name: Test Windows ARM64 dependency archive validation
      id: stage-10
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        pwsh -NoProfile -File ./tools/test_windows_arm64_libxml2.ps1
    - name: Build release compiler
      id: stage-11
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup --reconfigure .tmp/meson/build_release_compiler-0 . -Dcompiler_target=native -Dbuildtype=release -Dllvm_features=auto
        python -m mesonbuild.mesonmain compile -C .tmp/meson/build_release_compiler-0 --jobs 2 wavec
    - name: Run Rust tests
      id: stage-12
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        cargo test --jobs 2 --locked --workspace --all-targets --verbose
    - name: Check examples and standard library corpus
      id: stage-13
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" corpus --wavec target/release/wavec --run-std-examples --report-json wave-corpus.json
    - name: Run x86_64 SysV ABI contract tests
      id: stage-14
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        cargo test --jobs 2 --locked --test codegen_regressions x86_64_c_abi_interoperates_with_c --verbose
      env:
        WAVE_RUN_X86_64_INTEROP_TESTS: '1'
      if: |-
        ${{ always() }}
    - name: Record native Actions outcomes
      id: ci_report
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" ci report --target-id "$WAVE_CI_TARGET" --output ci-report.json
      env:
        WAVE_STEP_OUTCOMES: ${{ toJSON(steps) }}
      if: |-
        ${{ always() && steps.tooling_bootstrap.outcome == 'success' }}
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-ci-linux-amd64-build
        path: 'ci-report.json

          wave-corpus.json

          ${{ runner.temp }}/wave-ci-*/*.log

          '
        if-no-files-found: warn
        retention-days: 7
    env:
      WAVE_CI_TARGET: linux-amd64
  linux-arm64-build:
    name: Linux / arm64 / Build & test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v5
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
      with:
        components: rustfmt, clippy
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build native Rust maintenance tool
