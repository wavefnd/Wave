# SPDX-License-Identifier: MPL-2.0
name: Wave Nightly
'on':
  workflow_run:
    workflows:
    - Wave CI
    types:
    - completed
    branches:
    - master
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful canonical master Wave CI run ID to retry
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  NO_COLOR: '1'
jobs:
  nightly-gate:
    name: Shared / Nightly gate
    if: "${{ github.repository == 'wavefnd/Wave' &&\n    ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||\n     (github.event.workflow_run.conclusion == 'success' &&\n      github.event.workflow_run.event == 'push' &&\n      github.event.workflow_run.head_repository.full_name == 'wavefnd/Wave' &&\n      github.event.workflow_run.head_branch == 'master')) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.gate.outputs.source_sha }}
      compiler_version: ${{ steps.gate.outputs.compiler_version }}
      ci_run_id: ${{ steps.gate.outputs.ci_run_id }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: master
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Setup pinned native Rust tooling
      uses: dtolnay/rust-toolchain@1.89.0
    - name: Build native Rust maintenance tool
      id: tooling_bootstrap
      shell: bash
      timeout-minutes: 10
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup build-ci -Dcompiler=false
        ./build-ci/wave-tools prepare tooling --github-env "$GITHUB_ENV"
        ./build-ci/wave-tools prepare pins --github-env "$GITHUB_ENV"
    - name: Validate canonical CI source and installer deployment
      id: gate
      shell: bash
      timeout-minutes: 10
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" nightly --stage gate
      env:
        GH_TOKEN: ${{ github.token }}
        WAVE_NIGHTLY_CI_RUN: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
    env:
      WAVE_CI_TARGET: linux-amd64
  linux-native-package:
    name: Linux / ${{ matrix.display_arch }} / Package
    needs:
    - nightly-gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          display_arch: amd64
          runner: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
          archive_target: x86_64-linux-gnu
        - arch: arm64
          display_arch: arm64
          runner: ubuntu-24.04-arm
          target: aarch64-unknown-linux-gnu
          archive_target: aarch64-linux-gnu
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.nightly-gate.outputs.source_sha }}
        persist-credentials: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build native Rust maintenance tool
      id: tooling_bootstrap
      shell: bash
      timeout-minutes: 10
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup build-ci -Dcompiler=false
        ./build-ci/wave-tools prepare tooling --github-env "$GITHUB_ENV"
        ./build-ci/wave-tools prepare pins --github-env "$GITHUB_ENV"
    - name: Resolve canonical distribution identity
      id: package_paths
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" ci artifact --target "$WAVE_CI_TARGET" --github-output "$GITHUB_OUTPUT"
    - name: Verify exact canonical CI source
      id: verify_source
      shell: bash
      timeout-minutes: 3
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" nightly --stage verify-source
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Install packaging dependencies
      id: stage-3
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare host --target "$WAVE_CI_TARGET" --provision
    - name: Verify release tools
      id: stage-4
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        llvm-config --version
        llvm-config --targets-built
        llvm-mc --version
        llc --version
        ld.lld --version
    - name: Build and package
      id: stage-5
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup --reconfigure .tmp/meson/build_and_package-0 . "-Dcompiler_target=$WAVE_MATRIX_TARGET" -Dbuildtype=release -Dllvm_features=auto
        python -m mesonbuild.mesonmain compile -C .tmp/meson/build_and_package-0 --jobs 2 release
      env:
        WAVE_MATRIX_TARGET: ${{ matrix.target }}
    - name: Smoke test packaged compiler
      id: stage-6
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" check extracted-package --archive "$WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_ARCHIVE" --target "$WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_TARGET" --output "$RUNNER_TEMP/extracted-package"
      env:
        WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_ARCHIVE: ${{ steps.package_paths.outputs.archive }}
        WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_TARGET: ${{ steps.package_paths.outputs.target }}
    - name: Record native Actions outcomes
      id: ci_report
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" ci report --target-id "$WAVE_CI_TARGET" --output ci-report.json
      env:
        WAVE_STEP_OUTCOMES: ${{ toJSON(steps) }}
      if: |-
        ${{ always() && steps.tooling_bootstrap.outcome == 'success' }}
    - uses: actions/upload-artifact@v6
      with:
        name: nightly-package-linux-${{ matrix.display_arch }}
        path: 'wave-v${{ needs.nightly-gate.outputs.compiler_version }}-${{ matrix.archive_target }}.tar.gz

          wave-v${{ needs.nightly-gate.outputs.compiler_version }}-${{ matrix.archive_target }}.tar.gz.sha256

          wave-v${{ needs.nightly-gate.outputs.compiler_version }}-${{ matrix.archive_target }}.tar.gz.metadata.json

          '
        if-no-files-found: error
        retention-days: 7
      name: Upload package
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-nightly-linux-${{ matrix.display_arch }}-package
        path: 'ci-report.json

          ${{ runner.temp }}/wave-ci-*/*.log

          '
        if-no-files-found: warn
        retention-days: 7
    env:
      RELEASE_VERSION: ${{ needs.nightly-gate.outputs.compiler_version }}
      WAVE_NIGHTLY_CI_RUN: ${{ needs.nightly-gate.outputs.ci_run_id }}
      WAVE_CI_TARGET: ${{ matrix.target }}
  linux-loong64-package:
    name: Linux / loong64 / Package
    needs:
    - nightly-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.nightly-gate.outputs.source_sha }}
        persist-credentials: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - name: Enable LoongArch64 compiler execution
      uses: docker/setup-qemu-action@v4
      with:
        platforms: loong64
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build native Rust maintenance tool
      id: tooling_bootstrap
      shell: bash
      timeout-minutes: 10
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup build-ci -Dcompiler=false
        ./build-ci/wave-tools prepare tooling --github-env "$GITHUB_ENV"
        ./build-ci/wave-tools prepare pins --github-env "$GITHUB_ENV"
    - name: Resolve canonical distribution identity
      id: package_paths
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" ci artifact --target "$WAVE_CI_TARGET" --github-output "$GITHUB_OUTPUT"
    - name: Verify exact canonical CI source
      id: verify_source
      shell: bash
      timeout-minutes: 3
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" nightly --stage verify-source
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Install host build and emulation tools
      id: stage-3
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare host --target "$WAVE_CI_TARGET" --provision
    - name: Install pinned LoongArch toolchain
      id: stage-5-prerequisites-loongarch
      shell: bash
      timeout-minutes: 240
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare loongarch --provision
    - name: Validate pinned target SDK and configure Cargo
      id: stage-5-sdk
      shell: bash
      timeout-minutes: 240
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare cross --target "$WAVE_CI_TARGET" --work-dir "$RUNNER_TEMP/wave-cross-package" --sysroot "$WAVE_LOONGARCH64_SYSROOT" --cross-prefix "$WAVE_LOONGARCH64_SYSROOT/../bin/loongarch64-unknown-linux-gnu-" --host-llvm-bin "$LLVM_SYS_211_PREFIX/bin"
    - name: Build and smoke-test native LoongArch64 release
      id: stage-5
      shell: bash
      timeout-minutes: 240
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup --reconfigure .tmp/meson/cross-package . "-Dcompiler_target=$WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_TARGET" -Dbuildtype=release
        python -m mesonbuild.mesonmain compile -C .tmp/meson/cross-package --jobs 2 release
        "$WAVE_TOOLS" check extracted-package --archive "$WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_ARCHIVE" --target "$WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_TARGET" --output "$RUNNER_TEMP/extracted-package"
      env:
        WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_TARGET: ${{ steps.package_paths.outputs.target }}
        WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_ARCHIVE: ${{ steps.package_paths.outputs.archive }}
    - name: Record native Actions outcomes
      id: ci_report
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" ci report --target-id "$WAVE_CI_TARGET" --output ci-report.json
      env:
        WAVE_STEP_OUTCOMES: ${{ toJSON(steps) }}
      if: |-
        ${{ always() && steps.tooling_bootstrap.outcome == 'success' }}
    - uses: actions/upload-artifact@v6
      with:
        name: nightly-package-linux-loong64
        path: 'wave-v${{ needs.nightly-gate.outputs.compiler_version }}-loongarch64-linux-gnu.tar.gz

          wave-v${{ needs.nightly-gate.outputs.compiler_version }}-loongarch64-linux-gnu.tar.gz.sha256

          wave-v${{ needs.nightly-gate.outputs.compiler_version }}-loongarch64-linux-gnu.tar.gz.metadata.json

          '
        if-no-files-found: error
        retention-days: 7
      name: Upload package
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-nightly-linux-loong64-package
        path: 'ci-report.json

          ${{ runner.temp }}/wave-ci-*/*.log

          '
        if-no-files-found: warn
        retention-days: 7
    env:
      RELEASE_VERSION: ${{ needs.nightly-gate.outputs.compiler_version }}
      WAVE_NIGHTLY_CI_RUN: ${{ needs.nightly-gate.outputs.ci_run_id }}
      WAVE_CI_TARGET: linux-loong64
  linux-riscv64-package:
    name: Linux / riscv64 / Package
    needs:
    - nightly-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.nightly-gate.outputs.source_sha }}
        persist-credentials: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - name: Cache Cargo build inputs
      uses: actions/cache@v5
      with:
        path: '~/.cargo/registry

          ~/.cargo/git

          target/riscv64gc-unknown-linux-gnu'
        key: nightly-cargo-riscv64-${{ hashFiles('Cargo.lock', 'tools/ci/toolchains.json', 'tools/src/provision.rs', 'tools/src/sdk.rs', 'tools/src/package.rs') }}-${{ github.sha }}
        restore-keys: nightly-cargo-riscv64-${{ hashFiles('Cargo.lock', 'tools/ci/toolchains.json', 'tools/src/provision.rs', 'tools/src/sdk.rs', 'tools/src/package.rs') }}-
    - name: Enable RISC-V container execution
      uses: docker/setup-qemu-action@v4
      with:
        platforms: riscv64
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build native Rust maintenance tool
      id: tooling_bootstrap
      shell: bash
      timeout-minutes: 10
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup build-ci -Dcompiler=false
        ./build-ci/wave-tools prepare tooling --github-env "$GITHUB_ENV"
        ./build-ci/wave-tools prepare pins --github-env "$GITHUB_ENV"
    - name: Resolve canonical distribution identity
      id: package_paths
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" ci artifact --target "$WAVE_CI_TARGET" --github-output "$GITHUB_OUTPUT"
    - name: Verify exact canonical CI source
      id: verify_source
      shell: bash
      timeout-minutes: 3
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" nightly --stage verify-source
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Prepare host tools for pinned cross SDK
      id: stage-2-prerequisites
      shell: bash
      timeout-minutes: 300
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare host --target "$WAVE_CI_TARGET" --provision
    - name: Validate pinned target SDK and configure Cargo
      id: stage-2-sdk
      shell: bash
      timeout-minutes: 300
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare cross --target "$WAVE_CI_TARGET" --work-dir "$RUNNER_TEMP/wave-cross-package" --sysroot /usr/riscv64-linux-gnu --cross-prefix riscv64-linux-gnu- --host-llvm-bin "$LLVM_SYS_211_PREFIX/bin"
    - name: Build and smoke-test the native RISC-V release
      id: stage-2
      shell: bash
      timeout-minutes: 300
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup --reconfigure .tmp/meson/cross-package . "-Dcompiler_target=$WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_TARGET" -Dbuildtype=release
        python -m mesonbuild.mesonmain compile -C .tmp/meson/cross-package --jobs 2 release
        "$WAVE_TOOLS" check extracted-package --archive "$WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_ARCHIVE" --target "$WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_TARGET" --output "$RUNNER_TEMP/extracted-package"
      env:
        WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_TARGET: ${{ steps.package_paths.outputs.target }}
        WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_ARCHIVE: ${{ steps.package_paths.outputs.archive }}
    - name: Record native Actions outcomes
      id: ci_report
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" ci report --target-id "$WAVE_CI_TARGET" --output ci-report.json
      env:
        WAVE_STEP_OUTCOMES: ${{ toJSON(steps) }}
      if: |-
        ${{ always() && steps.tooling_bootstrap.outcome == 'success' }}
    - uses: actions/upload-artifact@v6
      with:
        name: nightly-package-linux-riscv64
        path: 'wave-v${{ needs.nightly-gate.outputs.compiler_version }}-riscv64-linux-gnu.tar.gz

          wave-v${{ needs.nightly-gate.outputs.compiler_version }}-riscv64-linux-gnu.tar.gz.sha256

          wave-v${{ needs.nightly-gate.outputs.compiler_version }}-riscv64-linux-gnu.tar.gz.metadata.json

          '
        if-no-files-found: error
        retention-days: 7
      name: Upload package
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-nightly-linux-riscv64-package
        path: 'ci-report.json

          ${{ runner.temp }}/wave-ci-*/*.log

          '
        if-no-files-found: warn
        retention-days: 7
    env:
      RELEASE_VERSION: ${{ needs.nightly-gate.outputs.compiler_version }}
      WAVE_NIGHTLY_CI_RUN: ${{ needs.nightly-gate.outputs.ci_run_id }}
      WAVE_CI_TARGET: linux-riscv64
  macos-native-package:
    name: macOS / ${{ matrix.display_arch }} / Package
    needs:
    - nightly-gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          display_arch: amd64
          runner: macos-15-intel
          target: x86_64-apple-darwin
        - arch: arm64
          display_arch: arm64
          runner: macos-15
          target: aarch64-apple-darwin
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.nightly-gate.outputs.source_sha }}
        persist-credentials: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build native Rust maintenance tool
      id: tooling_bootstrap
      shell: bash
      timeout-minutes: 10
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup build-ci -Dcompiler=false
        ./build-ci/wave-tools prepare tooling --github-env "$GITHUB_ENV"
        ./build-ci/wave-tools prepare pins --github-env "$GITHUB_ENV"
    - name: Resolve canonical distribution identity
      id: package_paths
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" ci artifact --target "$WAVE_CI_TARGET" --github-output "$GITHUB_OUTPUT"
    - name: Verify exact canonical CI source
      id: verify_source
      shell: bash
      timeout-minutes: 3
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" nightly --stage verify-source
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Install LLVM 21 and LLD
      id: stage-3
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare host --target "$WAVE_CI_TARGET" --provision
    - name: Verify release tools
      id: stage-4
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        llvm-config --version
        llvm-config --targets-built
        llvm-mc --version
        llc --version
        ld.lld --version
    - name: Build and package
      id: stage-5
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup --reconfigure .tmp/meson/build_and_package-0 . "-Dcompiler_target=$WAVE_MATRIX_TARGET" -Dbuildtype=release -Dllvm_features=auto
        python -m mesonbuild.mesonmain compile -C .tmp/meson/build_and_package-0 --jobs 2 release
      env:
        WAVE_MATRIX_TARGET: ${{ matrix.target }}
    - name: Smoke test packaged compiler
      id: stage-6
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" check extracted-package --archive "$WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_ARCHIVE" --target "$WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_TARGET" --output "$RUNNER_TEMP/extracted-package"
      env:
        WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_ARCHIVE: ${{ steps.package_paths.outputs.archive }}
        WAVE_STEPS_PACKAGE_PATHS_OUTPUTS_TARGET: ${{ steps.package_paths.outputs.target }}
    - name: Record native Actions outcomes
      id: ci_report
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" ci report --target-id "$WAVE_CI_TARGET" --output ci-report.json
      env:
        WAVE_STEP_OUTCOMES: ${{ toJSON(steps) }}
      if: |-
