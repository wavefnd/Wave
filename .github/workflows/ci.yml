  windows-arm64-build:
    name: Windows / arm64 / Build & test
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 90
    env:
      CARGO_PROFILE_RELEASE_DEBUG: '1'
      WAVE_CI_TARGET: windows-arm64
    steps:
    - uses: actions/checkout@v5
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
      with:
        components: rustfmt, clippy
    - uses: actions/setup-python@v6
      id: python_setup
      with:
        python-version: '3.11'
        architecture: arm64
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build native Rust maintenance tool
      id: tooling_bootstrap
      shell: pwsh
      timeout-minutes: 10
      run: |
        $ErrorActionPreference = "Stop"
        & 'python' '-m' 'mesonbuild.mesonmain' 'setup' 'build-ci' '-Dcompiler=false'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & './build-ci/wave-tools.exe' 'prepare' 'tooling' '--github-env' "$env:GITHUB_ENV"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & './build-ci/wave-tools.exe' 'prepare' 'pins' '--github-env' "$env:GITHUB_ENV"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Resolve canonical distribution identity
      id: package_paths
      shell: pwsh
      timeout-minutes: 30
      run: |
        $ErrorActionPreference = "Stop"
        & $env:WAVE_TOOLS 'ci' 'artifact' '--target' "$env:WAVE_CI_TARGET" '--github-output' "$env:GITHUB_OUTPUT"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Install pinned native LLVM 21
      id: stage-3
      shell: pwsh
      timeout-minutes: 30
      run: |
        $ErrorActionPreference = "Stop"
        & 'pwsh' '-NoProfile' '-File' './tools/provision_windows_msvc_llvm.ps1' '-Architecture' 'arm64'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Provision pinned ARM64 libxml2 for LLVM
      id: stage-4
      shell: pwsh
      timeout-minutes: 30
      run: |
        $ErrorActionPreference = "Stop"
        & 'pwsh' '-NoProfile' '-File' './tools/provision_windows_arm64_libxml2.ps1'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Verify native toolchain
      id: stage-5
      shell: pwsh
      timeout-minutes: 30
      run: |
        $ErrorActionPreference = "Stop"
        & $env:WAVE_TOOLS 'check' 'windows-host' '--target' 'aarch64-pc-windows-msvc'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Check formatting
      id: stage-6
      shell: pwsh
      timeout-minutes: 30
      run: |
        $ErrorActionPreference = "Stop"
        & $env:WAVE_TOOLS 'maintain' 'format' '--check'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Run Clippy for the ARM64 compiler
      id: stage-7
      shell: pwsh
      timeout-minutes: 30
      run: |
        $ErrorActionPreference = "Stop"
        & 'cargo' 'clippy' '--locked' '--target' 'aarch64-pc-windows-msvc' '--all-targets' '--no-default-features' '--features' 'llvm-target-aarch64' '--jobs' '2' '--' '-D' 'warnings'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Build native ARM64 compiler
      id: native_build
      shell: pwsh
      timeout-minutes: 30
      run: |
        $ErrorActionPreference = "Stop"
        & 'python' '-m' 'mesonbuild.mesonmain' 'setup' '--reconfigure' '.tmp/meson/build_native_arm64_compiler-0' '.' '-Dcompiler_target=aarch64-pc-windows-msvc' '-Dbuildtype=release' '-Dllvm_features=llvm-target-aarch64'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & 'python' '-m' 'mesonbuild.mesonmain' 'compile' '-C' '.tmp/meson/build_native_arm64_compiler-0' '--jobs' '2' 'wavec'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Run native hosted MSVC and bidirectional C ABI fixtures
      id: msvc_native
      shell: pwsh
      timeout-minutes: 20
      run: |
        $ErrorActionPreference = "Stop"
        & $env:WAVE_TOOLS 'msvc-acceptance' '--wavec' 'target/aarch64-pc-windows-msvc/release/wavec.exe' '--llvm-bin' "$env:WAVE_WINDOWS_LLVM_BIN" '--target' 'aarch64-pc-windows-msvc' '--output' "$env:RUNNER_TEMP/wave-msvc-native-arm64"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      if: |-
        ${{ !cancelled() && steps.native_build.outcome == 'success' }}
    - name: Verify native LLVM message allocator ownership
      id: stage-11
      shell: pwsh
      timeout-minutes: 30
      run: |
        $ErrorActionPreference = "Stop"
        & 'cargo' 'test' '--locked' '--no-fail-fast' '--release' '-p' 'llvm' '--test' 'message_ownership' '--target' 'aarch64-pc-windows-msvc' '--no-default-features' '--features' 'llvm-target-aarch64' '--jobs' '2'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      if: |-
