        python3 -m mesonbuild.mesonmain setup build-ci "-Dcompiler=false" "-Dci_family=package"
        "-Dci_target=linux-loong64" "-Dci_lanes=release/package-linux-loongarch64"
        "-Dci_provision=true" "-Dci_report=ci-report.json" && python3 -m mesonbuild.mesonmain
        compile -C build-ci ci
    - uses: actions/upload-artifact@v6
      with:
        name: ci-package-linux-loong64
        path: |
          wave-v*-loongarch64-linux-gnu.tar.gz
          wave-v*-loongarch64-linux-gnu.tar.gz.sha256
          wave-v*-loongarch64-linux-gnu.tar.gz.metadata.json
        if-no-files-found: error
        retention-days: 7
