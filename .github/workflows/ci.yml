# SPDX-License-Identifier: MPL-2.0
name: Wave CI
'on':
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
permissions:
  contents: read
concurrency:
  group: wave-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  PYTHONUNBUFFERED: '1'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:

  # Shared
  case-matrix:
    name: Shared / Case matrix
    runs-on: ubuntu-24.04
    outputs:
      linux: ${{ steps.procedure.outputs.linux }}
      macos: ${{ steps.procedure.outputs.macos }}
      windows: ${{ steps.procedure.outputs.windows }}
      windows_arm64: ${{ steps.procedure.outputs.windows_arm64 }}
      qemu: ${{ steps.procedure.outputs.qemu }}
      loongarch: ${{ steps.procedure.outputs.loongarch }}
      wasm: ${{ steps.procedure.outputs.wasm }}
      freebsd: ${{ steps.procedure.outputs.freebsd }}
      freestanding: ${{ steps.procedure.outputs.freestanding }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Resolve case matrix
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix || fromJSON('{}')) }}
      run: >-
        python3 -m mesonbuild.mesonmain setup build-ci "-Dcompiler=false" "-Dci_family=test"
        "-Dci_target=linux-amd64" "-Dci_lanes=cases/case-config" "-Dci_provision=true"
        "-Dci_report=ci-report.json" && python3 -m mesonbuild.mesonmain compile -C build-ci ci
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-ci-shared-matrix
        path: |
          ci-report.json
          wave-corpus.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7

  # Linux
  linux-amd64-build:
    name: Linux / amd64 / Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v5
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
      with:
        components: rustfmt, clippy
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned Meson and Ninja
      run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-build.txt
    - name: Build and test
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix || fromJSON('{}')) }}
      run: >-
        python3 -m mesonbuild.mesonmain setup build-ci "-Dcompiler=false" "-Dci_family=test"
        "-Dci_target=linux-amd64" "-Dci_lanes=rust/build-linux-amd64" "-Dci_provision=true"
        "-Dci_report=ci-report.json" && python3 -m mesonbuild.mesonmain compile -C build-ci ci
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-ci-linux-amd64-build
        path: |
          ci-report.json
          wave-corpus.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
  linux-arm64-build:
    name: Linux / arm64 / Build & test
    runs-on: ubuntu-24.04-arm
