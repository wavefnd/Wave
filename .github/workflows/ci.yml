    - name: Install LLVM 21 and RISC-V runtime tools
      id: stage-3
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare host --target "$WAVE_CI_TARGET" --provision
    - name: Verify RISC-V toolchain
      id: stage-4
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        llvm-config --version
        ld.lld --version
        riscv64-linux-gnu-gcc --version
        riscv64-linux-gnu-readelf --version
        qemu-riscv64 --version
    - name: Install Wave stdlib
      id: stage-5
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" prepare std
    - name: Check Rust formatting
      id: stage-6
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" maintain format --check
    - name: Run Clippy
      id: stage-7
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        cargo clippy --jobs 2 --locked --all-targets -- -D warnings
    - name: Run native Rust tooling contracts
      id: stage-8
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain test -C build-ci --suite tooling --print-errorlogs
    - name: Build release compiler
      id: release_build
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup --reconfigure .tmp/meson/build_release_compiler-0 . -Dcompiler_target=native -Dbuildtype=release -Dllvm_features=auto
        python -m mesonbuild.mesonmain compile -C .tmp/meson/build_release_compiler-0 --jobs 2 wavec
    - name: Run Rust tests
      id: stage-10
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        cargo test --jobs 2 --locked --all-targets --verbose
    - name: Build with the RISC-V-only LLVM feature
      id: stage-11
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup --reconfigure .tmp/meson/build_with_the_risc_v_only_llvm_feature-0 . -Dcompiler_target=native -Dbuildtype=debug -Dllvm_features=llvm-target-riscv
        python -m mesonbuild.mesonmain compile -C .tmp/meson/build_with_the_risc_v_only_llvm_feature-0 --jobs 2 wavec
    - name: Build with the LoongArch-only LLVM feature
      id: stage-12
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup --reconfigure .tmp/meson/build_with_the_loongarch_only_llvm_feature-0 . -Dcompiler_target=native -Dbuildtype=debug -Dllvm_features=llvm-target-loongarch
        python -m mesonbuild.mesonmain compile -C .tmp/meson/build_with_the_loongarch_only_llvm_feature-0 --jobs 2 wavec
    - name: Build with the x86-only LLVM feature
      id: stage-13
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup --reconfigure .tmp/meson/build_with_the_x86_only_llvm_feature-0 . -Dcompiler_target=native -Dbuildtype=debug -Dllvm_features=llvm-target-x86
        python -m mesonbuild.mesonmain compile -C .tmp/meson/build_with_the_x86_only_llvm_feature-0 --jobs 2 wavec
    - name: Build with the AArch64-only LLVM feature
      id: stage-14
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        python -m mesonbuild.mesonmain setup --reconfigure .tmp/meson/build_with_the_aarch64_only_llvm_feature-0 . -Dcompiler_target=native -Dbuildtype=debug -Dllvm_features=llvm-target-aarch64
        python -m mesonbuild.mesonmain compile -C .tmp/meson/build_with_the_aarch64_only_llvm_feature-0 --jobs 2 wavec
    - name: Run Rust tests with the core 64-bit LLVM feature set
      id: stage-15
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        cargo test --locked --all-targets --no-default-features --features llvm-target-core64 --jobs 2
    - name: Verify bundled Linux CRT matrix
      id: stage-16
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" check crt --receipt .tmp/meson/build_release_compiler-0/wavec.build.json --arch x86_64 --arch aarch64 --arch riscv64
      if: |-
        ${{ !cancelled() && steps.release_build.outcome == 'success' }}
    - name: Run RISC-V contract tests
      id: stage-17
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        cargo test --jobs 2 --locked --test codegen_regressions riscv64_ --verbose
      env:
        WAVE_RUN_RISCV64_INTEROP_TESTS: '1'
      if: |-
        ${{ always() }}
    - name: Check RISC-V aggregate register boundaries against Clang
      id: stage-18
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        cargo test --locked --test release_stabilization riscv64_ --jobs 2
      env:
        WAVE_RUN_RISCV64_INTEROP_TESTS: '1'
    - name: Run shared language workloads under AArch64 QEMU
      id: stage-19
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        cargo test --locked --test codegen_regressions aarch64_shared_language_workloads_run_under_qemu --jobs 2
      env:
        WAVE_RUN_AARCH64_INTEROP_TESTS: '1'
    - name: Run RISC-V networking contracts under QEMU
      id: stage-20
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" test --wavec target/release/wavec --target-id "$WAVE_CI_TARGET" --source examples/std/net_tcp.wave --source examples/std/net_udp.wave --source examples/std/net_ipv6.wave --source examples/std/net_dns.wave --source examples/std/net_interfaces.wave --source examples/std/net_unix.wave --source examples/std/net_vectored.wave --source examples/std/net_event.wave --report-json riscv_net.json
      if: |-
        ${{ !cancelled() && steps.release_build.outcome == 'success' }}
    - name: Record native Actions outcomes
      id: ci_report
      shell: bash
      timeout-minutes: 30
      run: |
        set -euo pipefail
        "$WAVE_TOOLS" ci report --target-id "$WAVE_CI_TARGET" --output ci-report.json
      env:
        WAVE_STEP_OUTCOMES: ${{ toJSON(steps) }}
      if: |-
        ${{ always() && steps.tooling_bootstrap.outcome == 'success' }}
    - name: Upload logs and summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: reports-ci-linux-riscv64-build
        path: 'ci-report.json

          wave-corpus.json

          ${{ runner.temp }}/wave-ci-*/*.log

          '
        if-no-files-found: warn
        retention-days: 7
    env:
      WAVE_CI_TARGET: linux-riscv64
  linux-targets-cases:
    name: Linux / ${{ matrix.arch }} / Cases / shard ${{ matrix.shard_index }}
    needs:
    - case-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.case-matrix.outputs.linux) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
