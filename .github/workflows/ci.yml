        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      env:
        WAVE_RUNTIME_ARTIFACT_DIR: ${{ runner.temp }}
      if: |-
        ${{ !cancelled() && steps.native_build.outcome == 'success' }}
    - name: Install Wave stdlib
      id: stdlib
      shell: pwsh
      timeout-minutes: 30
      run: |
        $ErrorActionPreference = "Stop"
        & $env:WAVE_TOOLS 'prepare' 'std'
